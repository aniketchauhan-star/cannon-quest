<!-- No loading screen: the start screen shows as soon as the game and the start screen's pictures are in. So all of
     it starts downloading with the page itself, before anything else, and first: the scripts (each one waits on the
     one before it, so none may queue behind a picture), the words, then every picture on the start screen. The play
     scene's own pictures have data-src in the markup (no download yet): boot gives them their src once the start screen
     is up, so they arrive while the player looks at it. -->
<link rel="preload" href="libs/gsap.min.js" as="script">
<link rel="preload" href="js/i18n.js" as="script">
<link rel="preload" href="js/script.js" as="script">
<link rel="preload" href="js/sfx_title.js" as="script">
<script>/* the words (js/i18n.js reads the .json, or the .js from disk, where a fetch is blocked) */
(function () { var l = document.createElement('link'), disk = location.protocol === 'file:'; l.rel = 'preload';
  if (disk) { l.as = 'script'; l.href = 'locales/locales.js'; } else { l.as = 'fetch'; l.crossOrigin = 'anonymous'; l.href = 'locales/locales.json'; }
  document.head.appendChild(l); })();
</script>
<link rel="preload" as="image" href="assets/img/bg_sky.webp" fetchpriority="high">
<link rel="preload" as="image" href="assets/img/sun_glow.webp" fetchpriority="high">
<link rel="preload" as="image" href="assets/img/sun_rays.webp" fetchpriority="high">
<link rel="preload" as="image" href="assets/img/bg_mount.webp" fetchpriority="high">
<link rel="preload" as="image" href="assets/img/bg_trees.webp" fetchpriority="high">
<link rel="preload" as="image" href="assets/img/bg_plantL.webp" fetchpriority="high">
<link rel="preload" as="image" href="assets/img/bg_plantR.webp" fetchpriority="high">
<link rel="preload" as="image" href="assets/img/bg_deck.webp" fetchpriority="high">
<link rel="preload" as="image" href="assets/img/t_logo.webp" fetchpriority="high">
<link rel="preload" as="image" href="assets/img/t_cannon.webp" fetchpriority="high">
<link rel="preload" as="image" href="assets/img/playbtn.webp" fetchpriority="high">
<link rel="preload" as="image" href="assets/img/t_cage.webp" fetchpriority="high">
<link rel="preload" as="image" href="assets/img/t_x.webp" fetchpriority="high">
<link rel="preload" as="image" href="assets/img/t_cage_front.webp" fetchpriority="high">
<!--FONTS-->
<style>
:root{--ink:#1a1740;--gold:#ffcb3d;--orange:#ff9418;--plum:#2a1c5c;--glass:rgba(28,19,78,.88);--glass-hi:rgba(48,34,120,.94)}
*{box-sizing:border-box;margin:0;padding:0}
/* one typeface, one weight: Poppins SemiBold (600), embedded by build.sh. No outlines on text, no fake bold */
html,body{width:100%;height:100%;overflow:hidden;background:#0198fc;font-family:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-weight:600;font-synthesis:none;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;color:var(--ink)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
img{-webkit-user-drag:none;user-select:none}
#viewport{position:fixed;inset:0;overflow:hidden;background:linear-gradient(#0198fc,#0aa3fc 22%,#53c9fd 32%,#96eefd 38%,#00b1a6 50%,#ec9e4c 70%,#d8853b)} /* (the picture's colours, until it has loaded) */
#stage{position:absolute;left:0;top:0;width:1672px;height:941px;transform-origin:0 0}
#world{position:absolute;left:0;top:0;width:1672px;height:941px;transform-origin:0 0;will-change:transform}
.spr{position:absolute;display:block;pointer-events:none}
/* ---------- background: the user's deck picture (art/background/new_background.png), cut into parallax layers by
   tools/cut_deck_bg.py (bg units = the 1672×941 frame; Stage scales it to cover). At rest the layers stack back into
   the picture exactly. Each one also goes on a little under the layer in front of it, for the camera's parallax
   (PARALLAX in src/30_stage.js). The boxes are the ones that tool prints. ---------- */
#bg{position:absolute;left:0;top:0;width:1672px;height:941px;transform-origin:0 0;pointer-events:none}
#bg .bl{position:absolute;display:block;max-width:none;pointer-events:none}
/* the sky without its clouds: a smooth gradient, saved at 1/4 size and stretched. The only cloud in the game is the
   equation's (the user removed the painted ones on 19 Nov) */
#bgSky{left:0;top:0;width:1672px;height:941px}
/* the sun, top right (SUN in src/32_scenery.js places it): the sky brightening toward it, its bloom, two
   counter-turning glare layers (sun_glow / sun_rays from tools/make_sun.py), a lens streak and the white disc */
#bgSun{left:0;top:0;width:0;height:0}
#bgSun>*{position:absolute;display:block;max-width:none;pointer-events:none}
#bgSun .sk{left:-850px;top:-850px;width:1700px;height:1700px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,253,234,.55),rgba(255,250,222,.28) 22%,rgba(255,250,222,.1) 55%,rgba(255,250,222,0))}
#bgSun .sg{left:-380px;top:-380px;width:760px;height:760px;animation:sglow 5.5s ease-in-out infinite alternate}
#bgSun .sr{left:-500px;top:-500px;width:1000px;height:1000px;opacity:.6}
#bgSun .r1{animation:sspin 210s linear infinite,sbreath 4.7s ease-in-out infinite alternate}
#bgSun .r2{transform:scaleX(-1) rotate(17deg);animation:sspin2 270s linear infinite,sbreath 6.3s -3s ease-in-out infinite alternate-reverse}
#bgSun .ss{left:-320px;top:-2.5px;width:640px;height:5px;border-radius:50%;opacity:.5;background:linear-gradient(90deg,rgba(255,250,235,0),rgba(255,250,235,.25) 32%,rgba(255,255,255,.85) 50%,rgba(255,250,235,.25) 68%,rgba(255,250,235,0))}
#bgSun .sd{left:-28px;top:-28px;width:56px;height:56px;border-radius:50%;background:radial-gradient(closest-side,#fff 0,#fff 70%,rgba(255,255,250,.92) 80%,rgba(255,253,240,.4) 91%,rgba(255,250,232,0) 100%);animation:spulse 3.3s ease-in-out infinite alternate}
@keyframes sglow{from{opacity:.86}to{opacity:1}}
@keyframes sspin{to{transform:rotate(360deg)}}
@keyframes sspin2{from{transform:scaleX(-1) rotate(17deg)}to{transform:scaleX(-1) rotate(377deg)}}
@keyframes sbreath{from{opacity:.42}to{opacity:.82}}
@keyframes spulse{to{transform:scale(1.07)}}
/* birds: a few, now and then, crossing the sky between the hills and the treetops (Birds in src/32_scenery.js flies
   each one; GSAP, so they stop on pause). Each flaps a few times, then glides, rising a little on the beats */
#bgBirds{left:0;top:0;width:0;height:0}
.bird{position:absolute;left:0;top:0;width:44px;height:30px;margin:-15px 0 0 -22px;will-change:transform}
.bird .bb{display:block;width:100%;height:100%;animation:bbob 2.4s ease-in-out infinite}
.bird svg{display:block;width:100%;height:100%;overflow:visible;fill:#24395a;opacity:.86}
.bird .w{transform-box:view-box;transform-origin:22px 15px;animation:flap 2.4s ease-in-out infinite}
@keyframes flap{0%,16%,32%{transform:scaleY(1)}8%,24%,40%{transform:scaleY(-.6)}50%,100%{transform:scaleY(.55)}}
@keyframes bbob{0%{transform:translateY(0)}42%{transform:translateY(-5px)}100%{transform:translateY(0)}}
#bgMount{left:0;top:261.5px;width:1672px;height:229.5px}
#bgTrees{left:0;top:263.5px;width:1672px;height:455.5px}
/* the jungle's life, over the trees and behind the railing (Jungle in src/32_scenery.js places each piece):
   mist drifting low between the trees, soft shafts of sunlight that breathe, sunlit specks floating up, and now and
   then a leaf tumbling down from the trees */
#bgJungle{left:0;top:0;width:0;height:0}
#bgJungle>i{position:absolute;display:block;pointer-events:none}
#bgJungle .ms{border-radius:50%;background:radial-gradient(closest-side,rgba(234,251,246,.72),rgba(234,251,246,.36) 55%,rgba(234,251,246,0));animation:mdrift 50s ease-in-out infinite alternate}
@keyframes mdrift{from{transform:translateX(calc(var(--mx) * -1))}to{transform:translateX(var(--mx))}}
#bgJungle .sh{transform-origin:50% 0;background:linear-gradient(90deg,rgba(255,247,210,0),rgba(255,247,210,.4) 30%,rgba(255,250,225,.55) 50%,rgba(255,247,210,.4) 70%,rgba(255,247,210,0));
  -webkit-mask-image:linear-gradient(rgba(0,0,0,0) 0,rgba(0,0,0,0) 30%,#000 56%,rgba(0,0,0,.65) 80%,rgba(0,0,0,0));mask-image:linear-gradient(rgba(0,0,0,0) 0,rgba(0,0,0,0) 30%,#000 56%,rgba(0,0,0,.65) 80%,rgba(0,0,0,0));
  animation:shb 7s ease-in-out infinite alternate}
@keyframes shb{from{opacity:.3}to{opacity:.85}}
#bgJungle .mt{width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%;opacity:0;background:radial-gradient(closest-side,#fffbe6,rgba(255,244,190,.75) 45%,rgba(255,240,170,0));animation:mote 9s ease-in-out infinite}
@keyframes mote{0%{opacity:0;transform:translate(0,0) scale(.6)}30%{opacity:1}65%{opacity:.8}100%{opacity:0;transform:translate(var(--mx),var(--my)) scale(1)}}
#bgJungle .lf{opacity:0;animation:lfall 16s linear infinite}
#bgJungle .lf b{display:block;animation:lsway 2.6s ease-in-out infinite alternate}
#bgJungle .lf svg{display:block;width:26px;height:26px;animation:lspin 1.9s ease-in-out infinite alternate}
@keyframes lfall{0%{opacity:0;transform:translate(0,0)}6%{opacity:1}52%{opacity:1}62%,100%{opacity:0;transform:translate(var(--lx),var(--ly))}}
@keyframes lsway{from{transform:translateX(-16px)}to{transform:translateX(16px)}}
@keyframes lspin{from{transform:rotate(-34deg) scaleX(1)}to{transform:rotate(38deg) scaleX(.35)}}
/* the two leafy plants behind the railing sway in the wind about their roots, under the deck (keyframes made there) */
.plant{transform-origin:50% 100%}
.plant img{display:block;width:100%;height:100%;transform-origin:50% 100%;animation:wplant 12s linear infinite}
#bgPlantL{left:82px;top:557px;width:114.5px;height:107px}
#bgPlantR{left:1496.5px;top:554.5px;width:93px;height:108.5px}
/* the railing (posts + ropes) and the wooden deck the cannon and the tray stand on */
#bgDeck{left:0;top:464px;width:1672px;height:477px}
/* the scenery freezes with the game */
.scnPause #bg *{animation-play-state:paused !important}


/* ---------- the equation cloud: the question sits right on the cloud ---------- */
/* (far off in the sky: Cloud.apply draws it, label and equation included, at CLOUD_FAR; lifted so its top stays near the screen's top edge) */
#cloud{position:absolute;left:500px;top:-23px;width:656px;height:300px;transform-origin:50% 62%;will-change:transform}
/* the cloud art (tools/paint_cloud.py): painted like the clouds of the deck picture, so it belongs to that sky: a big
   dome, puffs stepping down, a flat blue base whose wisps run out 62 px past the box on each side; lit by the sun */
#cloud .cl{position:absolute;left:-52px;top:10px;width:760px;height:281px}
/* No box: the question sits right on the cloud (the user asked to remove the card on 19 Nov). During play there is no
   label, only the equation (the user removed "Find the value of x" on 19 Nov); at the end a small dark label
   (the same dark glass + gold ring as Skip and the caption) reads "Your score", under the cloud's top bump. The equation
   sits in the middle of the cloud's body (its centre of mass), always fitted inside the cloud (EqUI.maxW / maxH).
   Measured on cloud.webp (tools/paint_cloud.py), in #cloud box px: the body is solid from x 108 to 548 below y 166,
   down to its flat base at y 270; its middle is x 328 */
#qCard{position:absolute;left:0;top:0;width:656px;height:0;pointer-events:none}
#qTab{position:absolute;left:328px;top:80px;translate:-50% -50%;padding:7px 24px;border-radius:99px;background:var(--glass);box-shadow:0 0 0 3px #ffd23d,0 5px 12px rgba(20,10,60,.24);color:#fff;font-size:25px;line-height:1.2;letter-spacing:.01em;white-space:nowrap}
#qTab:empty{display:none}
#eqBox{position:absolute;left:328px;top:178px;width:0;height:0} /* (the middle of the cloud's body) */
/* the equation, the orbs' numbers and the caption's words (on the user's question template): Trig Text (the user's
   font, 19 Nov), its one weight (400) */
#eq,.ball b,#cap .txt{font-family:'Trig Text','Poppins',system-ui,sans-serif;font-weight:400}
#eq{position:absolute;left:0;top:0;transform:translate(-50%,-50%);display:flex;align-items:center;white-space:nowrap;font-size:70px;line-height:1;letter-spacing:-.01em;font-variant-numeric:lining-nums;color:var(--ink);transform-origin:0 0}
#eq.wob{animation:eqwob .45s ease-in-out 3}
@keyframes eqwob{25%{rotate:-3deg}75%{rotate:3deg}}
.tk{display:inline-flex;align-items:center;justify-content:center;position:relative;flex:none}
.op{margin:0 .17em}
.eqs{margin:0 .24em}
.paren{transform:scaleY(1.12);margin:0 .02em}
.frac{display:inline-flex;flex-direction:column;align-items:center;font-size:.78em;margin:0 .06em}
.frac>.fn,.frac>.fd{display:flex;align-items:center;justify-content:center;padding:0 .12em}
.frac>.fb{align-self:stretch;height:.08em;min-height:4px;border-radius:9px;background:currentColor;margin:.08em 0}
.ng{margin-right:.04em}
/* ÷ drawn to the same stroke weight as Poppins SemiBold's + − = */
.dv{display:inline-block;position:relative;width:.56em;height:.62em;flex:none}
.dv::before{content:'';position:absolute;left:.02em;right:.02em;top:calc(50% - .045em);height:.09em;background:currentColor;border-radius:1em}
.dv::after{content:'';position:absolute;left:50%;top:.04em;width:.13em;height:.13em;margin-left:-.065em;border-radius:50%;background:currentColor;box-shadow:0 .41em 0 currentColor}
/* in Trig Text (the equation, the orbs) the font's own ÷ matches its digits, so the drawn one gives way to it */
#eq .dv,.ball b .dv{width:auto;height:auto}
#eq .dv::before,.ball b .dv::before{content:'÷';position:static;background:none;height:auto;border-radius:0}
#eq .dv::after,.ball b .dv::after{content:none}
.inc{color:var(--tok)}
.inc .op{margin:0 .12em 0 .17em}
.hid{opacity:0;transform:scale(.4)}
/* a term arriving: fades up from 40 % with a small overshoot (back.out ~1.25), then rests */
.pop{animation:pop .6s cubic-bezier(.3,1.3,.6,1) both}
@keyframes pop{0%{opacity:0;transform:scale(.4)}40%{opacity:1}100%{opacity:1;transform:scale(1)}}
/* the terms about to combine light up together: one soft gold pill behind each side's group, so "+5 −5" reads as
   one group and "7 −5" as another (EqUI.pair places it, in #eq's own units, under the terms) */
.hlg{position:absolute;box-sizing:content-box;padding:.06em .16em;margin:-.06em 0 0 -.16em;border-radius:.3em;pointer-events:none;
  background:linear-gradient(#fff0b0,#ffe07a);box-shadow:0 0 0 .035em rgba(255,176,30,.5),0 .05em .14em rgba(170,100,0,.16);animation:hlin .55s cubic-bezier(.22,1,.36,1) both}
.hlg.out{animation:hlout .7s ease-in forwards}
@keyframes hlin{from{opacity:0;transform:scale(.86,.5)}to{opacity:1;transform:none}}
@keyframes hlout{from{opacity:1}to{opacity:0}}
/* terms that cancel: a small lift, then shrink + fade (ease-in; its length is set from Motion.BEAT.CANCEL, which the timeline waits for) */
.van{animation:van .7s cubic-bezier(.5,0,.75,.45) forwards}
@keyframes van{0%{opacity:1;transform:none}30%{opacity:1;transform:scale(1.06) translateY(-.04em)}100%{opacity:0;transform:scale(.35) translateY(-.08em)}}
.msg{display:flex;flex-direction:column;align-items:center;color:#7b2ff0}
.msg .m1{font-size:.5em;color:var(--ink);letter-spacing:.01em}
.msg .m2{font-size:1em;margin-top:.04em}
/* the cage around x */
.cage{height:1.72em;margin:0 .02em}
.cage img{height:100%;width:auto;display:block;transform-origin:50% 90%}
.cage.push img{animation:cpush 1.2s ease-in-out 2}
@keyframes cpush{0%,100%{transform:none}20%{transform:translateX(-4%) rotate(-5deg)}35%{transform:translateX(-5%) scaleX(.96)}55%{transform:translateX(4%) rotate(5deg)}70%{transform:translateX(5%) scaleX(.96)}}
.cage.rattle img{animation:rattle .16s ease-in-out 8} /* (a rocking "not yet", ~6 per second: 11 per second read as jitter) */
@keyframes rattle{25%{transform:translateX(-6%) rotate(-6deg)}75%{transform:translateX(6%) rotate(6deg)}}
.cage.glowx img{filter:drop-shadow(0 0 10px #fff) drop-shadow(0 0 24px #c58bff)}
.cage.open img{animation:copen .5s ease-out}
@keyframes copen{40%{transform:scale(1.15) rotate(-6deg)}}
/* freed: the cage breaks and x jumps out (CageBreak in src/30_stage.js moves them all by transform + opacity). The
   cage's own picture stays in the equation unseen, so nothing in the line moves; a glow behind the cage builds with
   x's pushes and flares out at the break; the pieces are the empty cage (cage_empty.webp) cut by clip-paths; the
   free x stands where the cage was, 78 % of its height, and breathes about its feet (the scale property, so it adds to
   its own transform) */
.cage .caura{position:absolute;left:-40%;top:-22%;width:180%;height:144%;z-index:-1;border-radius:50%;opacity:0;pointer-events:none;
  background:radial-gradient(closest-side,rgba(255,255,255,.95),rgba(255,240,170,.62) 38%,rgba(197,139,255,.34) 66%,rgba(197,139,255,0))}
.cage .cbit{position:absolute;left:0;top:0;width:100%;height:100%;visibility:hidden;pointer-events:none;background:url(assets/img/cage_empty.webp) 0 0/100% 100% no-repeat}
.cage .xfree{position:absolute;left:50%;top:50%;height:78%;width:auto;visibility:hidden;pointer-events:none;transform-origin:50% 100%;transform:translate(-50%,-50%);
  filter:drop-shadow(0 0 8px #fff) drop-shadow(0 0 18px rgba(197,139,255,.85))}
.cage .xfree.live{animation:xbreathe 1.4s ease-in-out infinite}
@keyframes xbreathe{0%,100%{scale:1}50%{scale:1.06}} /* the freed x rests on the cloud and breathes, in step with “= 2” */
/* "= 2" lights up as x lands, growing 18 %; it steps aside to keep "x = 2" apart (translate, not margins: the
   equation's layout never changes, so nothing jumps) */
.tk.eqs.win{translate:.06em 0}
.tk.num.win{translate:.22em 0}
.tk.win{color:#7a22d6;text-shadow:0 0 16px rgba(255,214,70,.85),0 0 32px rgba(255,180,30,.5);transition:translate .6s cubic-bezier(.22,1,.36,1);animation:winpop .8s cubic-bezier(.22,1,.36,1) both,winglow 1.4s .85s ease-in-out infinite}
@keyframes winpop{0%{transform:scale(1)}45%{transform:scale(1.3)}100%{transform:scale(1.18)}}
@keyframes winglow{0%,100%{transform:scale(1.18)}50%{transform:scale(1.26)}}
/* the cloud bursting (CloudBurst): the pieces of its own picture, laid exactly over it, each with its blurred twin */
.cbits{position:absolute;pointer-events:none}
.cbits .cb{position:absolute;visibility:hidden}
.cbits canvas{position:absolute;display:block}

/* ---------- cannon, sockets, FIRE ---------- */
#cannon{position:absolute;left:0;top:0}
#cannonBody,#cannonFrontBody{position:absolute;width:0;height:0;transform-origin:0 0}
#cannonBody img,#cannonFrontBody img{position:absolute;bottom:0;transform:translateX(-50%);left:0}
#cannonFront{position:absolute;left:0;top:0;pointer-events:none}
/* a loaded socket's dark lining (the hole's art is lit at the bottom, which made the ball look pushed up): an even,
   deep socket all round the ball, a little darker under the ring's top lip */
.sbk{position:absolute;display:block;border-radius:50%;pointer-events:none;opacity:0;transition:opacity .2s ease-out;
  background:radial-gradient(circle at 50% 46%,#2b1306 0,#1a0903 58%,#0d0401 100%);box-shadow:inset 0 5px 7px rgba(0,0,0,.65)}
.sbk.on{opacity:1}
.sglow{position:absolute;border-radius:50%;pointer-events:none;opacity:0;box-shadow:0 0 0 7px rgba(255,236,120,.95),0 0 34px 16px rgba(255,196,40,.9),inset 0 0 26px 8px rgba(255,220,90,.7);transition:opacity .2s}
.sglow.on{opacity:1;animation:sg .5s ease-in-out infinite alternate}
@keyframes sg{to{transform:scale(1.08)}}
/* socket order markers (1, 2): the same dark-glass chip as the caption and Skip */
.stag{position:absolute;width:42px;height:42px;margin:-21px 0 0 -21px;border-radius:50%;background:var(--glass);box-shadow:0 0 0 2.5px var(--gold),0 4px 10px rgba(20,10,60,.3);color:#fff;font-size:22px;line-height:1;display:grid;place-items:center;padding-top:1px}
.stag.pulse{animation:tagp .9s ease-in-out 2}
@keyframes tagp{50%{transform:scale(1.22)}}
#fireBtn{position:absolute;cursor:pointer;transition:transform .12s ease-out;transform-origin:50% 60%}
#fireBtn img{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
#fireBtn.two img.p1,#fireBtn:not(.two) img.p2{display:none} /* each cannon has its own pill (Cannon.placeFire) */
#fireBtn .gr{filter:grayscale(1) brightness(1.06) contrast(.85);opacity:0;transition:opacity .25s ease-in}#fireBtn.off .gr{opacity:1;transition-timing-function:ease-out}
#fireBtn.off{cursor:default}
/* the word on the button (the pill art is blank): T('btnFire'), white like the painted word; Cannon sets its size
   from the button's height and shrinks it to fit a longer word */
#fireBtn .ft{position:absolute;left:50%;top:50%;transform:translate(-50%,-44%);color:#fff;line-height:1;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap;pointer-events:none;text-shadow:0 .05em 0 rgba(140,24,0,.55),0 0 .14em rgba(120,20,0,.35)}
#fireBtn.off .ft{text-shadow:0 .05em 0 rgba(60,60,60,.45)}
#fireBtn .fgl{position:absolute;inset:-45% -22%;border-radius:50%;pointer-events:none;opacity:0;background:radial-gradient(closest-side,rgba(255,236,120,.95),rgba(255,160,40,.7) 45%,rgba(255,106,31,0))}
#fireBtn.glow{animation:fglow .9s ease-out 1}
#fireBtn.glow .fgl{animation:fglowL .9s ease-out 1}
@keyframes fglow{30%{transform:scale(1.14)}}
@keyframes fglowL{30%{opacity:1}100%{opacity:0}}
#fireBtn.hint{animation:fhint .9s ease-in-out 3}
#fireBtn.hint .fgl{animation:fhintL .9s ease-in-out 3}
@keyframes fhint{50%{transform:scale(1.1)}}
@keyframes fhintL{50%{opacity:.8}}
#fireBtn.press{transform:scale(.9)}

/* ---------- rack + balls ---------- */
.hglow{position:absolute;width:126px;height:58px;margin:-29px 0 0 -63px;border-radius:50%;pointer-events:none;opacity:0;box-shadow:0 0 0 5px #ffe46b,0 0 28px 12px rgba(255,205,50,.85)}
.hglow.on{animation:hg 1s ease-out 1}
@keyframes hg{25%{opacity:1}100%{opacity:0}}
.ball{position:absolute;left:0;top:0;width:122px;height:122px;margin:-61px 0 0 -61px;cursor:grab;touch-action:none} /* = BALL_D */
/* a ball in the player's hand (Drag): it rides in #fly, above everything, with a soft shadow dropped below it */
.ball.drag img{filter:drop-shadow(0 16px 10px rgba(40,18,4,.34))}
body.dragging,body.dragging *{cursor:grabbing !important}
.ball.mv{will-change:transform}
.ball img{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.ball b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:52px;line-height:1;letter-spacing:-.02em;color:var(--ink);padding-top:2px;pointer-events:none;text-shadow:0 2px 0 rgba(255,255,255,.28)}
.ball b .dv{margin-right:.03em}
.ball .gl{position:absolute;inset:-34%;border-radius:50%;pointer-events:none;opacity:0;background:radial-gradient(closest-side,rgba(255,251,208,.95),rgba(255,214,40,.75) 48%,rgba(255,196,0,0))}
.ball.guide img{filter:drop-shadow(0 0 9px #fff6a0) drop-shadow(0 0 20px #ffc800)}
.ball.guide .gl{animation:guide .9s ease-in-out infinite alternate}
@keyframes guide{from{opacity:.55;transform:scale(.9)}to{opacity:1;transform:scale(1.06)}}
.ball.hov img{filter:brightness(1.12)}
.ball.gone{display:none}
.ball .ao{position:absolute;inset:3%;border-radius:50%;background:radial-gradient(ellipse 70% 32% at 50% 90%,rgba(66,26,4,.5),rgba(66,26,4,.2) 58%,rgba(66,26,4,0) 100%);opacity:0;transition:opacity .25s;pointer-events:none}
.ball.seated .ao{opacity:1}
/* in the cannon's socket the orb fills the hole edge to edge: only a soft shade where the ring's top lip overhangs
   it (none round the sides or the bottom, so no dark band reads as a gap between the orb and the ring) */
.ball.insock .ao{opacity:1;inset:2%;background:radial-gradient(circle at 50% 64%,rgba(40,14,0,0) 60%,rgba(40,14,0,.22) 80%,rgba(40,14,0,.34) 100%)}
.bshadow{position:absolute;width:0;height:0;opacity:0;transition:opacity .25s;pointer-events:none} /* at the seated ball's centre */
.bshadow.on{opacity:1}
.bshadow i{position:absolute;border-radius:50%}
.bshadow .cast{left:-34px;top:-58px;width:124px;height:124px;background:radial-gradient(closest-side,rgba(52,18,0,.58),rgba(52,18,0,.5) 70%,rgba(52,18,0,0))} /* on the back wall, down-right of the ball */
.bshadow .pool{left:-72px;top:28px;width:148px;height:32px;background:radial-gradient(closest-side,rgba(36,10,0,.9),rgba(36,10,0,.6) 58%,rgba(36,10,0,0))} /* where the ball meets the trough, just above the rail */
/* ---------- ground contact: shadow groups multiply onto the plaza; light + ring groups paint normally so colour reads on bright sand ---------- */
#ground{position:absolute;left:0;top:0;width:0;height:0;pointer-events:none}
.gsh{position:absolute;left:0;top:0;width:0;height:0;transform-origin:0 0;pointer-events:none}
.gsh.shadow{mix-blend-mode:multiply}
.gsh i{position:absolute;display:block;border-radius:50%}
/* (warm brown: the cannon and tray stand on a wooden deck) */
.gsh .soft{background:radial-gradient(closest-side,rgba(70,36,10,.7),rgba(70,36,10,.42) 45%,rgba(70,36,10,0));filter:blur(6px)}
.gsh .cast{background:radial-gradient(closest-side,rgba(70,36,10,.45),rgba(70,36,10,.24) 50%,rgba(70,36,10,0));filter:blur(9px)}
.gsh .pool{background:radial-gradient(closest-side,rgba(66,32,8,.72),rgba(66,32,8,.6) 55%,rgba(66,32,8,.3) 82%,rgba(66,32,8,0));filter:blur(7px)} /* (a wide, even shadow that spreads past a base: start screen) */
.gsh .contact{background:radial-gradient(closest-side,rgba(40,18,4,.95),rgba(40,18,4,.62) 50%,rgba(40,18,4,0));filter:blur(2px)}
.gsh .ao{background:radial-gradient(closest-side,rgba(30,12,2,.95),rgba(30,12,2,.75) 60%,rgba(30,12,2,0));filter:blur(1.5px)} /* (where a base meets the boards: start screen) */
.gsh .glow{background:radial-gradient(closest-side,rgba(90,236,255,.62),rgba(90,236,255,.28) 50%,rgba(90,236,255,0));filter:blur(2px)}
.gsh .gold{border:3px solid rgba(255,248,205,.95);box-shadow:0 0 6px 2px rgba(255,214,70,.95),0 0 18px 7px rgba(255,176,20,.65),inset 0 0 8px 2px rgba(255,214,70,.8)}

/* ---------- caption (what the voice says): the user's question template, on the left, halfway down ----------
   art/ui/question_template.png (an orange wooden frame, dark-brown outline, cream panel), cut by
   tools/cut_question_board.py at 0.5 into assets/img/question_board.webp (1070×272) and painted as a 9-slice at 0.25
   (half the WebP, so it stays sharp on a 2× screen) into the canvas .bg by Caption.paint (src/20_audio.js), in whole
   device pixels so the pieces meet without seams. That is the template's own proportions: the whole thick wooden
   frame and its grain show; the corners stay as drawn and only straight frame and cream stretch to the words. The
   words (36px) sit in the cream panel, whose inset at 0.25 is 24 / 19 / 19.5 / 18.5 px (top right bottom left), with
   the speaker icon on the first line. Dark-brown words on the cream, so they always read. It hugs its words
   (Caption.fit: as wide as its longest line), is at most 560 wide (its right edge stays clear of the cannon at
   x ~595) and stays centred on y 470 (#capPos, in #stageTop: above the FX canvas, so cannon smoke never hides the
   words). It shows only while a voice line is being said: it rises in as the voice starts, each word pops in as it
   is said, it glides between lines and sinks away after the line (transform + opacity) */
#overlay{position:absolute;inset:0;pointer-events:none}
#capPos{position:absolute;left:30px;top:470px;height:0;display:flex;align-items:center;pointer-events:none}
#cap{position:relative;flex:none;max-width:560px;padding:40px 42px 35px 82px;color:#4a2508;font-size:36px;line-height:1.3;letter-spacing:.005em;opacity:0;transform-origin:0 50%}
#cap .bg{position:absolute;left:0;top:0;width:100%;height:100%;display:block;transform-origin:0 0;filter:drop-shadow(0 7px 9px rgba(40,18,4,.3))}
#cap .txt{display:block;position:relative;text-wrap:balance}
/* its words come one by one with the voice (Caption.upTo): each is its own box so it can pop in (transform +
   opacity); a one-letter word (x) and the word after it share a .nw group, so x never ends a row */
#cap .w{display:inline-block;opacity:0}
#cap .nw{white-space:nowrap}
#cap svg{position:absolute;left:34px;top:47px;width:33px;height:33px;color:#c2621a}

/* ---------- HUD (from the art: pause, sound) ---------- */
#hud{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .3s ease-out}
/* ---------- spotlight tutorial: blur + dim everything except the focus ----------
   up to two clear holes (--x/--y/--rx/--ry, and --x2/… for a second one, parked off screen when unused): each mask
   layer is clear inside its hole, and the two are intersected, so both holes stay clear */
#spot{position:absolute;left:0;top:0;width:0;height:0;pointer-events:none}
#spot .sl{position:absolute;inset:0;opacity:0;--x:0px;--y:0px;--rx:100px;--ry:100px;--x2:-9999px;--y2:-9999px;--rx2:1px;--ry2:1px;
  background:rgba(14,10,42,.36);-webkit-backdrop-filter:blur(7px) saturate(.8);backdrop-filter:blur(7px) saturate(.8);
  -webkit-mask-image:radial-gradient(ellipse var(--rx) var(--ry) at var(--x) var(--y),transparent 0,transparent 78%,#000 100%),radial-gradient(ellipse var(--rx2) var(--ry2) at var(--x2) var(--y2),transparent 0,transparent 78%,#000 100%);
  mask-image:radial-gradient(ellipse var(--rx) var(--ry) at var(--x) var(--y),transparent 0,transparent 78%,#000 100%),radial-gradient(ellipse var(--rx2) var(--ry2) at var(--x2) var(--y2),transparent 0,transparent 78%,#000 100%);
  -webkit-mask-composite:source-in;mask-composite:intersect}
/* the drag lesson's see-through ball (Spot.demo): a copy of the −5 with a soft light round it */
#spotGhost{pointer-events:none;cursor:default;opacity:0}
#spotGhost img{filter:drop-shadow(0 0 8px rgba(255,248,200,.95)) drop-shadow(0 0 18px rgba(255,214,70,.6))}
#spotRing,#spotRing2{position:absolute;left:0;top:0;width:200px;height:200px;border-radius:50%;pointer-events:none;opacity:0;
  border:5px solid rgba(255,228,120,.95);box-shadow:0 0 16px 5px rgba(255,196,50,.55),inset 0 0 12px 3px rgba(255,220,100,.35)}
#spotHand{position:absolute;left:0;top:0;width:90px;height:126.9px;margin:-32.6px 0 0 -34.4px;display:block;max-width:none;pointer-events:none;opacity:0;transform-origin:34.4px 32.6px;filter:drop-shadow(0 6px 7px rgba(20,10,60,.35))} /* your hand (art/ui/hand.webp); its fingertip is the point that taps */
body.spot #hud.on{opacity:.5}
#hud.on{opacity:1}
.hbtn{position:absolute;top:max(10px,2.4vh);width:clamp(46px,5.3vw,96px);aspect-ratio:132/133;pointer-events:auto;transition:transform .12s;filter:drop-shadow(0 4px 6px rgba(0,0,0,.18))}
.hbtn img{width:100%;height:100%;display:block}
.hbtn:active{transform:scale(.9)}
#pauseBtn{left:max(10px,2vw)}
#sndBtn{left:calc(max(10px,2vw) + clamp(46px,5.3vw,96px) + max(8px,1vw))}
#sndBtn.muted::after{content:'';position:absolute;left:14%;right:14%;top:47%;height:9%;background:#e8132b;border-radius:9px;transform:rotate(-40deg);box-shadow:0 0 0 3px #fff}
#skipBtn{position:absolute;top:max(10px,2.4vh);right:max(10px,2vw);height:clamp(40px,4.4vw,58px);padding:0 clamp(14px,1.5vw,22px) 0 clamp(16px,1.7vw,24px);display:flex;align-items:center;gap:.4em;border-radius:99px;background:var(--glass);color:#fff;font-size:clamp(16px,1.7vw,23px);line-height:1;letter-spacing:.01em;box-shadow:0 0 0 2px rgba(255,210,61,.85),0 6px 16px rgba(20,10,60,.24);opacity:0;pointer-events:none;transition:background-color .15s ease-out,scale .12s ease-out}
#skipBtn.on{pointer-events:auto}
#skipBtn:hover{background:var(--glass-hi)}
#skipBtn:active{scale:.95} /* (scale, not transform: GSAP owns its transform for the enter/exit) */
#skipBtn span{padding-top:.08em}
#skipBtn svg{width:.9em;height:.9em;flex:none}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
/* flying balls ride above the particles (so a ball and its label read through the muzzle blast), in a copy of
   the stage + camera transform that Stage keeps in step with the world */
#stageTop{position:absolute;left:0;top:0;width:1672px;height:941px;transform-origin:0 0;pointer-events:none}
#worldTop{position:absolute;left:0;top:0;width:1672px;height:941px;transform-origin:0 0;will-change:transform;pointer-events:none}
/* low quality tier (Perf): the spotlight dims without the live blur */
body.lowfx #spot .sl{-webkit-backdrop-filter:none;backdrop-filter:none;background:rgba(14,10,42,.52)}
/* glows whose opacity breathes all the time get their own layer, so they never repaint the plaza */
.gsh.light{will-change:opacity}
#thumb.live .gsh{will-change:transform,opacity}

/* ---------- start screen: the user's mockup (art/start_screen/start_mockup.png), see src/35_title.js ---------- */
#world.title #cloud,#world.title #cannon,#world.title #rack,#world.title #rackFront,#world.title #balls,#world.title #bshadows,#world.title #hglows,#world.title #ground,#world.title #cannonFront{visibility:hidden}
#thumb{position:absolute;inset:0;pointer-events:none}
#thumb.gone{display:none}
.tp{position:absolute;display:block;transform-origin:50% 50%;pointer-events:none}
#thumb.live .tp,#thumb.live #playBtn,#thumb.live .tx{will-change:transform,opacity}
.tp.lit{filter:brightness(1.2) drop-shadow(0 0 16px rgba(255,236,150,.9))}
/* the cannon group: its picture + a glint; the cage group: its whole picture, x's shadow on the floor, x, its front
   bars (x is inside, between them), a glint */
.tgrp img{position:absolute;display:block;max-width:none;pointer-events:none}
/* a glint (Title.glint): a soft slanted band of light; through it shows the piece's gold, washed bright */
.gband{position:absolute;left:0;top:0;overflow:hidden;transform-origin:0 0;opacity:0;pointer-events:none;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 30%,#000 70%,transparent);mask-image:linear-gradient(90deg,transparent,#000 30%,#000 70%,transparent)}
.gband img{left:0;top:0;transform-origin:0 0}
#thumb.live .gband,#thumb.live .gband img{will-change:transform,opacity}
.tcage .tx{transform-origin:50% 92%}
.tcage .xsh{position:absolute;display:block;border-radius:50%;transform-origin:50% 50%;background:radial-gradient(closest-side,rgba(120,56,0,.6),rgba(120,56,0,.28) 55%,rgba(120,56,0,0))}
#playBtn{position:absolute;pointer-events:auto;cursor:pointer;transform-origin:50% 50%}
#playBtn img{position:relative;width:100%;height:100%;display:block;pointer-events:none;filter:drop-shadow(0 6px 10px rgba(80,20,0,.35))}
#playBtn .pg{position:absolute;inset:-16%;border-radius:50%;pointer-events:none;opacity:0;background:radial-gradient(closest-side,rgba(255,226,120,.95),rgba(255,214,90,.55) 55%,rgba(255,214,90,0))}
#playBtn .rp{position:absolute;inset:6%;border-radius:50%;border:5px solid rgba(255,232,140,.9);opacity:0;pointer-events:none}
#playBtn.live .rp{animation:ripple 2.2s ease-out infinite}
@keyframes ripple{0%{transform:scale(.95);opacity:.8}100%{transform:scale(1.45);opacity:0}}

/* ---------- end ---------- */
/* the Play again button sits in the clear sky between the score cloud and the cannon (stage units, in #overlay) */
#endUI{position:absolute;left:836px;top:404px;width:112px;height:112px;margin:-56px 0 0 -56px;opacity:0;pointer-events:none;transform:translateY(14px) scale(.92);transition:opacity .2s ease-in,transform .2s ease-in}
#endUI.on{opacity:1;transform:none;pointer-events:auto;transition:opacity .4s cubic-bezier(.22,1,.36,1),transform .5s cubic-bezier(.34,1.3,.64,1)}
.rbtn{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 34% 26%,#ffe1a1 0 7%,#ffb03b 26%,#ff8a0d 58%,#ef6400 100%);box-shadow:0 0 0 5px #fff,0 7px 0 5px #b84e00,0 16px 28px rgba(20,10,60,.38);transition:scale .12s ease-out}
.rbtn:active{scale:.94}
.rbtn svg{width:46%;height:46%}

/* ---------- rotate hint ---------- */
#rotate{position:fixed;inset:0;display:none;place-items:center;text-align:center;background:rgba(20,12,60,.9);color:#fff;font-size:20px;line-height:1.45;padding:30px;z-index:20}
#rotate .ph{width:70px;height:110px;border:6px solid #fff;border-radius:16px;margin:0 auto 20px;animation:rot 2s ease-in-out infinite}
@keyframes rot{40%,70%{transform:rotate(90deg)}}
#rotate button{margin-top:22px;padding:11px 24px 10px;border-radius:99px;background:#fff;color:#3a2280;font-size:16px;letter-spacing:.01em}
@media (orientation:portrait) and (max-aspect-ratio:3/4){#rotate:not(.dismissed){display:grid}}
/* ---------- first paint: no loading screen. Until the start screen's pictures are in (usually well under a second)
   the screen is just the sky (#viewport's gradient); then the scene fades in and the start screen plays its intro ---------- */
html:not(.fit) #stage,html:not(.fit) #stageTop{visibility:hidden} /* (until fitStage has scaled it to the screen: no unscaled first frame) */
#world{opacity:0}                                      /* the painted scene fades in once its pictures are in (boot) */
#playBtn{opacity:0}                                    /* Title pops it in */
#flash{position:fixed;inset:0;background:radial-gradient(circle at 50% 25%,rgba(255,255,240,.85),rgba(255,255,255,0) 60%);opacity:0;transition:opacity .5s;pointer-events:none}
#flash.on{opacity:1;transition:opacity .08s}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;animation-delay:0s !important;transition-duration:.01ms !important;transition-delay:0s !important}
  #flash{display:none}
}
</style>

    </div>
  </div>
  <canvas id="fx"></canvas>
  <!-- the caption sits above the FX canvas (cannon smoke never covers its words), in stage units but not moved by
       the camera; what flies (#worldTop) still passes over it -->
  <div id="stageTop"><div id="capPos"><div id="cap"><canvas class="bg"></canvas><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h3l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7"/></svg><span class="txt"></span></div></div><div id="worldTop"><div id="fly"></div></div></div>
  <div id="flash"></div>
  <div id="hud">
    <button id="pauseBtn" class="hbtn" data-i18n-attr="aria-label:btnPause"><img data-src="assets/img/pause.webp" alt=""></button>
    <button id="sndBtn" class="hbtn" data-i18n-attr="aria-label:btnSound"><img data-src="assets/img/sound.webp" alt=""></button>

  </div>
  <div id="rotate"><div><div class="ph"></div><span data-i18n-html="rotateHint"></span><br><button id="rotateOk" data-i18n="btnPlayAnyway"></button></div></div></div>
