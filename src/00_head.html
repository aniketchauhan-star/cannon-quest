<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title data-i18n="gameTitle"></title>
<meta name="description" content="" data-i18n-attr="content:metaDescription">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="preload" href="js/script.js" as="script">
<style>
:root{--ink:#1a1740;--gold:#ffcb3d;--orange:#ff9418;--plum:#2a1c5c}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#3cb8f6;font-family:'Fredoka',ui-rounded,'Arial Rounded MT Bold',system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;color:var(--ink)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
img{-webkit-user-drag:none;user-select:none}
#viewport{position:fixed;inset:0;overflow:hidden;background:linear-gradient(#36b3f5,#9ad9ff)}
#stage{position:absolute;left:0;top:0;width:1672px;height:941px;transform-origin:0 0}
#world{position:absolute;left:0;top:0;width:1672px;height:941px;transform-origin:0 0;will-change:transform}
.spr{position:absolute;display:block;pointer-events:none}
/* ---------- background: your layer sheet, as parallax layers (bg units = the 1672×941 frame; Stage scales it to cover) ---------- */
#bg{position:absolute;left:0;top:0;width:1672px;height:941px;transform-origin:0 0;pointer-events:none}
#bg .bl{position:absolute;display:block;max-width:none;pointer-events:none}
#bgSky{left:-500px;top:-700px;width:2672px;height:1700px;background:radial-gradient(circle at 1880px 760px,rgba(255,253,228,.75) 0,rgba(255,250,214,.32) 150px,rgba(255,250,214,0) 420px),linear-gradient(#1c9cf0 0,#2aa8f5 700px,#6cc6f8 1000px,#ace3fb 1240px,#bdeafc 1700px)}
#bgMount{left:-134px;top:322px;width:1940px;height:200.5px}
#bgTrees{left:-134px;top:404px;width:1940px;height:168px}
#bgLake{left:-134px;top:546px;width:1940px;height:121.5px}
#bgLake img{position:absolute;inset:0;width:100%;height:100%;display:block}
#bgLake i{position:absolute;height:5px;border-radius:9px;background:rgba(255,255,255,.95);box-shadow:0 0 6px 1px rgba(255,255,255,.7);opacity:0;animation:glint 3.4s ease-in-out infinite}
@keyframes glint{0%,100%{opacity:0;transform:scaleX(.3)}45%,55%{opacity:.9;transform:scaleX(1)}}
#bgGround{left:-60px;top:560px;width:1792px;height:411px}
.fore{transform-origin:50% 100%}
.fore img{display:block;width:100%;height:100%;transform-origin:50% 100%;animation:sway 4.6s ease-in-out infinite alternate}
#bgForeL{left:-36px;top:797.5px;width:316px;height:157.5px}
#bgForeR{left:1439.5px;top:803px;width:262.5px;height:152px}
#bgForeR img{animation-duration:5.3s;animation-delay:-2.1s}
@keyframes sway{from{transform:rotate(-1.8deg) skewX(1.2deg)}to{transform:rotate(1.5deg) skewX(-1deg)}}


/* ---------- the equation cloud ---------- */
#cloud{position:absolute;left:500px;top:-2px;width:656px;height:300px;transform-origin:50% 62%;will-change:transform}
#cloud .cl{position:absolute;inset:0;width:100%;height:100%}
#eqBox{position:absolute;left:328px;top:164px;width:0;height:0}
#eq{position:absolute;left:0;top:0;transform:translate(-50%,-50%);display:flex;align-items:center;white-space:nowrap;font-weight:700;font-size:94px;line-height:1;color:var(--ink);-webkit-text-stroke:2.5px var(--ink);transform-origin:0 0}
#eq.wob{animation:eqwob .3s ease-in-out 3}
@keyframes eqwob{25%{rotate:-3deg}75%{rotate:3deg}}
.tk{display:inline-flex;align-items:center;justify-content:center;position:relative;flex:none}
.op{margin:0 .17em}
.eqs{margin:0 .24em}
.paren{font-weight:600;transform:scaleY(1.15);margin:0 .02em}
.frac{display:inline-flex;flex-direction:column;align-items:center;font-size:.78em;margin:0 .06em}
.frac>.fn,.frac>.fd{display:flex;align-items:center;justify-content:center;padding:0 .12em}
.frac>.fb{align-self:stretch;height:.1em;min-height:5px;border-radius:9px;background:currentColor;margin:.07em 0}
.ng{margin-right:.04em}
.dv{display:inline-block;position:relative;width:.58em;height:.68em;flex:none}
.dv::before{content:'';position:absolute;left:0;right:0;top:calc(50% - .07em);height:.14em;background:currentColor;border-radius:1em}
.dv::after{content:'';position:absolute;left:50%;top:.02em;width:.17em;height:.17em;margin-left:-.085em;border-radius:50%;background:currentColor;box-shadow:0 .47em 0 currentColor}
.inc{color:var(--tok);-webkit-text-stroke:3px var(--tok)}
.inc .op{margin:0 .12em 0 .17em}
.hid{opacity:0;transform:scale(.2)}
.pop{animation:pop .5s cubic-bezier(.2,1.7,.45,1) both}
@keyframes pop{0%{opacity:0;transform:scale(.15)}100%{opacity:1;transform:scale(1)}}
.van{animation:van .46s ease-in forwards}
@keyframes van{0%{opacity:1;transform:scale(1)}35%{opacity:1;transform:scale(1.3) translateY(-.06em)}100%{opacity:0;transform:scale(.05)}}
.msg{display:flex;flex-direction:column;align-items:center;color:#7b2ff0;-webkit-text-stroke:3px #7b2ff0}
.msg .m1{font-size:.56em}
.msg .m2{font-size:1em;margin-top:.06em}
/* the cage around x */
.cage{height:1.95em;margin:0 .02em;-webkit-text-stroke:0}
.cage img{height:100%;width:auto;display:block;transform-origin:50% 90%}
.cage.push img{animation:cpush 1.2s ease-in-out 2}
@keyframes cpush{0%,100%{transform:none}20%{transform:translateX(-4%) rotate(-5deg)}35%{transform:translateX(-5%) scaleX(.96)}55%{transform:translateX(4%) rotate(5deg)}70%{transform:translateX(5%) scaleX(.96)}}
.cage.rattle img{animation:rattle .09s linear 16}
@keyframes rattle{25%{transform:translateX(-6%) rotate(-6deg)}75%{transform:translateX(6%) rotate(6deg)}}
.cage.glowx img{filter:drop-shadow(0 0 10px #fff) drop-shadow(0 0 24px #c58bff)}
.cage.open img{animation:copen .5s ease-out}
/* freed: the happy x replaces the cage so the cloud reads “x = 2” */
.cage.free img{height:78%;animation:xfree .6s cubic-bezier(.2,1.7,.45,1) both,xhop .8s .6s ease-in-out infinite;filter:drop-shadow(0 0 8px #fff) drop-shadow(0 0 18px rgba(197,139,255,.85))}
@keyframes xfree{0%{transform:scale(.2) rotate(-25deg)}100%{transform:none}}
@keyframes xhop{50%{transform:translateY(-9%) rotate(5deg)}}
.tk.eqs.win{margin-left:.42em}
.tk.win{color:#7a22d6;-webkit-text-stroke-color:#7a22d6;text-shadow:0 0 16px rgba(255,214,70,.85),0 0 32px rgba(255,180,30,.5);animation:winpop .65s cubic-bezier(.2,1.7,.45,1) both,winglow 1.1s .65s ease-in-out infinite alternate}
@keyframes winpop{0%{transform:scale(1)}50%{transform:scale(1.4)}100%{transform:scale(1.18)}}
@keyframes winglow{from{transform:scale(1.18)}to{transform:scale(1.26)}}
#eq.fadeout{opacity:0 !important;transition:opacity .4s !important}
@keyframes copen{40%{transform:scale(1.15) rotate(-6deg)}}

/* ---------- cannon, sockets, FIRE ---------- */
#cannon{position:absolute;left:0;top:0}
#cannonBody,#cannonFrontBody{position:absolute;width:0;height:0;transform-origin:0 0}
#cannonBody img,#cannonFrontBody img{position:absolute;bottom:0;transform:translateX(-50%);left:0}
#cannonFront{position:absolute;left:0;top:0;pointer-events:none}
.sglow{position:absolute;border-radius:50%;pointer-events:none;opacity:0;box-shadow:0 0 0 7px rgba(255,236,120,.95),0 0 34px 16px rgba(255,196,40,.9),inset 0 0 26px 8px rgba(255,220,90,.7);transition:opacity .2s}
.sglow.on{opacity:1;animation:sg .5s ease-in-out infinite alternate}
@keyframes sg{to{transform:scale(1.08)}}
.stag{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:12px;background:#3d2a6b;border:4px solid var(--gold);color:#fff;font-weight:700;font-size:27px;display:grid;place-items:center;box-shadow:0 4px 0 rgba(0,0,0,.2);transition:transform .3s}
.stag.pulse{animation:tagp 1s ease-in-out 2}
@keyframes tagp{50%{transform:scale(1.4)}}
#fireBtn{position:absolute;cursor:pointer;transition:transform .12s ease-out;transform-origin:50% 60%}
#fireBtn img{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
#fireBtn .gr{filter:grayscale(1) brightness(1.06) contrast(.85);opacity:0;transition:opacity .25s ease-in}#fireBtn.off .gr{opacity:1;transition-timing-function:ease-out}
#fireBtn.off{cursor:default}
#fireBtn .fgl{position:absolute;inset:-45% -22%;border-radius:50%;pointer-events:none;opacity:0;background:radial-gradient(closest-side,rgba(255,236,120,.95),rgba(255,160,40,.7) 45%,rgba(255,106,31,0))}
#fireBtn.glow{animation:fglow .9s ease-out 1}
#fireBtn.glow .fgl{animation:fglowL .9s ease-out 1}
@keyframes fglow{30%{transform:scale(1.14)}}
@keyframes fglowL{30%{opacity:1}100%{opacity:0}}
#fireBtn.hint{animation:fhint .9s ease-in-out 3}
#fireBtn.hint .fgl{animation:fhintL .9s ease-in-out 3}
@keyframes fhint{50%{transform:scale(1.1)}}
@keyframes fhintL{50%{opacity:.8}}
#fireBtn.press{transform:scale(.9)}

/* ---------- rack + balls ---------- */
.hglow{position:absolute;width:116px;height:54px;margin:-27px 0 0 -58px;border-radius:50%;pointer-events:none;opacity:0;box-shadow:0 0 0 5px #ffe46b,0 0 28px 12px rgba(255,205,50,.85)}
.hglow.on{animation:hg 1s ease-out 1}
@keyframes hg{25%{opacity:1}100%{opacity:0}}
.ball{position:absolute;left:0;top:0;width:112px;height:112px;margin:-56px 0 0 -56px;cursor:pointer;touch-action:none}
.ball.mv{will-change:transform}
.ball img{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.ball b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:52px;letter-spacing:-1px;color:var(--ink);-webkit-text-stroke:2.4px var(--ink);padding-bottom:4px;pointer-events:none;text-shadow:0 3px 0 rgba(255,255,255,.3)}
.ball b .dv{margin-right:.03em}
.ball .gl{position:absolute;inset:-34%;border-radius:50%;pointer-events:none;opacity:0;background:radial-gradient(closest-side,rgba(255,251,208,.95),rgba(255,214,40,.75) 48%,rgba(255,196,0,0))}
.ball.guide img{filter:drop-shadow(0 0 9px #fff6a0) drop-shadow(0 0 20px #ffc800)}
.ball.guide .gl{animation:guide .9s ease-in-out infinite alternate}
@keyframes guide{from{opacity:.55;transform:scale(.9)}to{opacity:1;transform:scale(1.06)}}
.ball.hov img{filter:brightness(1.12)}
.ball.gone{display:none}
.ball .ao{position:absolute;inset:3%;border-radius:50%;background:radial-gradient(ellipse 72% 46% at 50% 97%,rgba(24,14,58,.62),rgba(24,14,58,.28) 55%,rgba(24,14,58,0) 100%);opacity:0;transition:opacity .25s;pointer-events:none}
.ball.seated .ao{opacity:1}
.bshadow{position:absolute;width:98px;height:36px;margin:-18px 0 0 -49px;border-radius:50%;background:radial-gradient(ellipse at center,rgba(18,22,70,.5) 0,rgba(18,22,70,.25) 45%,rgba(18,22,70,0) 72%);opacity:0;transition:opacity .25s;pointer-events:none}
.bshadow.on{opacity:1}
.xfly{position:absolute;left:0;top:0;width:112px;height:115px;margin:-57.5px 0 0 -56px;pointer-events:none}
.xfly img{width:100%;height:100%;display:block;filter:drop-shadow(0 0 10px rgba(255,255,255,.9)) drop-shadow(0 0 22px rgba(197,139,255,.8))}
/* ---------- ground contact: shadow groups multiply onto the plaza; light + ring groups paint normally so colour reads on bright sand ---------- */
#ground{position:absolute;left:0;top:0;width:0;height:0;pointer-events:none}
.gsh{position:absolute;left:0;top:0;width:0;height:0;transform-origin:0 0;pointer-events:none}
.gsh.shadow{mix-blend-mode:multiply}
.gsh i{position:absolute;display:block;border-radius:50%}
.gsh .soft{background:radial-gradient(closest-side,rgba(52,30,78,.7),rgba(52,30,78,.42) 45%,rgba(52,30,78,0));filter:blur(6px)}
.gsh .cast{background:radial-gradient(closest-side,rgba(52,30,78,.45),rgba(52,30,78,.24) 50%,rgba(52,30,78,0));filter:blur(9px)}
.gsh .contact{background:radial-gradient(closest-side,rgba(26,14,40,.95),rgba(26,14,40,.62) 50%,rgba(26,14,40,0));filter:blur(2px)}
.gsh .glow{background:radial-gradient(closest-side,rgba(90,236,255,.62),rgba(90,236,255,.28) 50%,rgba(90,236,255,0));filter:blur(2px)}
.gsh .gold{border:3px solid rgba(255,248,205,.95);box-shadow:0 0 6px 2px rgba(255,214,70,.95),0 0 18px 7px rgba(255,176,20,.65),inset 0 0 8px 2px rgba(255,214,70,.8)}

/* ---------- caption bubble (temporary VO) ---------- */
#overlay{position:absolute;inset:0;pointer-events:none}
#cap{position:absolute;left:58px;top:420px;width:440px;padding:22px 26px 22px 70px;border-radius:28px;background:rgba(30,20,82,.9);color:#fff;font-weight:600;font-size:30px;line-height:1.25;box-shadow:0 0 0 4px var(--gold),0 14px 30px rgba(0,0,0,.25);opacity:0;transform:translateY(16px) scale(.96);transition:opacity .2s ease-in,transform .2s ease-in}
#cap.on{opacity:1;transform:none;transition:opacity .25s cubic-bezier(.22,1,.36,1),transform .25s cubic-bezier(.22,1,.36,1)}
#cap svg{position:absolute;left:22px;top:24px;width:34px;height:34px}

/* ---------- HUD (from the art: pause, sound) ---------- */
#hud{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .3s ease-out}
/* ---------- spotlight tutorial: blur + dim everything except the focus ---------- */
#spot{position:absolute;left:0;top:0;width:0;height:0;pointer-events:none}
#spot .sl{position:absolute;inset:0;opacity:0;--x:0px;--y:0px;--rx:100px;--ry:100px;
  background:rgba(14,10,42,.36);-webkit-backdrop-filter:blur(7px) saturate(.8);backdrop-filter:blur(7px) saturate(.8);
  -webkit-mask-image:radial-gradient(ellipse var(--rx) var(--ry) at var(--x) var(--y),transparent 0,transparent 78%,#000 100%);
  mask-image:radial-gradient(ellipse var(--rx) var(--ry) at var(--x) var(--y),transparent 0,transparent 78%,#000 100%)}
#spotRing{position:absolute;left:0;top:0;width:200px;height:200px;border-radius:50%;pointer-events:none;opacity:0;
  border:5px solid rgba(255,228,120,.95);box-shadow:0 0 16px 5px rgba(255,196,50,.55),inset 0 0 12px 3px rgba(255,220,100,.35)}
#spotHand{position:absolute;left:0;top:0;width:96px;height:116px;margin-left:-40px;pointer-events:none;opacity:0;transform-origin:40px 0;overflow:visible;filter:drop-shadow(0 6px 7px rgba(20,10,60,.35))}
body.spot #hud.on{opacity:.5}
#hud.on{opacity:1}
.hbtn{position:absolute;top:max(10px,2.4vh);width:clamp(46px,5.3vw,96px);aspect-ratio:132/133;pointer-events:auto;transition:transform .12s;filter:drop-shadow(0 4px 6px rgba(0,0,0,.18))}
.hbtn img{width:100%;height:100%;display:block}
.hbtn:active{transform:scale(.9)}
#pauseBtn{left:max(10px,2vw)}
#sndBtn{left:calc(max(10px,2vw) + clamp(46px,5.3vw,96px) + max(8px,1vw))}
#sndBtn.muted::after{content:'';position:absolute;left:14%;right:14%;top:47%;height:9%;background:#e8132b;border-radius:9px;transform:rotate(-40deg);box-shadow:0 0 0 3px #fff}
#skipBtn{position:absolute;top:max(10px,2.4vh);right:max(10px,2vw);height:clamp(40px,4.6vw,64px);padding:0 clamp(14px,1.6vw,24px) 0 clamp(16px,1.8vw,26px);display:flex;align-items:center;gap:.45em;border-radius:99px;background:rgba(30,20,82,.9);color:#fff;font-weight:700;font-size:clamp(17px,1.9vw,26px);box-shadow:0 0 0 3px var(--gold),0 6px 14px rgba(0,0,0,.22);opacity:0;pointer-events:none;transition:background-color .15s ease-out}
#skipBtn.on{pointer-events:auto}
#skipBtn:hover{background:rgba(52,36,128,.95)}
#skipBtn:active{transform:scale(.96)}
#skipBtn svg{width:.95em;height:.95em;flex:none}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
/* flying balls ride above the particles (so a ball and its label read through the muzzle blast), in a copy of
   the stage + camera transform that Stage keeps in step with the world */
#stageTop{position:absolute;left:0;top:0;width:1672px;height:941px;transform-origin:0 0;pointer-events:none}
#worldTop{position:absolute;left:0;top:0;width:1672px;height:941px;transform-origin:0 0;will-change:transform;pointer-events:none}
/* low quality tier (Perf): the spotlight dims without the live blur */
body.lowfx #spot .sl{-webkit-backdrop-filter:none;backdrop-filter:none;background:rgba(14,10,42,.52)}
/* glows whose opacity breathes all the time get their own layer, so they never repaint the plaza */
.gsh.light{will-change:opacity}
#thumb.live .gsh{will-change:transform,opacity}

/* ---------- start screen (thumbnail from the art) ---------- */
#world.title #cloud,#world.title #cannon,#world.title #rack,#world.title #rackFront,#world.title #balls,#world.title #bshadows,#world.title #hglows,#world.title #ground,#world.title #cannonFront{visibility:hidden}
#thumb{position:absolute;inset:0;pointer-events:none}
#thumb.gone{display:none}
.tp{position:absolute;display:block;transform-origin:50% 50%;pointer-events:none}
#thumb.live .tp,#thumb.live #rays,#thumb.live #sunGlow,#thumb.live #playBtn{will-change:transform,opacity}
.tp.lit{filter:brightness(1.22) drop-shadow(0 0 16px rgba(255,236,150,.9))}
.tp.fireLit{filter:brightness(1.18) drop-shadow(0 0 16px rgba(255,90,40,.7))}
.tp.fireBase{filter:drop-shadow(0 0 6px rgba(255,90,40,.7))}
#rays{position:absolute;left:836px;top:560px;width:2700px;height:2700px;border-radius:50%;opacity:0;pointer-events:none;
  background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.36) 0deg 5deg,rgba(255,255,255,0) 5deg 15deg);
  -webkit-mask:radial-gradient(circle,#000 0,rgba(0,0,0,.7) 16%,transparent 58%);mask:radial-gradient(circle,#000 0,rgba(0,0,0,.7) 16%,transparent 58%)}
#sunGlow{position:absolute;left:836px;top:560px;width:720px;height:720px;border-radius:50%;opacity:0;pointer-events:none;
  background:radial-gradient(circle,rgba(255,255,240,1) 0,rgba(255,250,215,.75) 16%,rgba(255,246,200,.25) 36%,rgba(255,255,255,0) 62%)}
#playBtn{position:absolute;pointer-events:auto;cursor:pointer;transform-origin:50% 50%}
#playBtn img{position:relative;width:100%;height:100%;display:block;pointer-events:none;filter:drop-shadow(0 6px 10px rgba(80,20,0,.35))}
#playBtn .pg{position:absolute;inset:-16%;border-radius:50%;pointer-events:none;opacity:0;background:radial-gradient(closest-side,rgba(255,226,120,.95),rgba(255,214,90,.55) 55%,rgba(255,214,90,0))}
#playBtn .rp{position:absolute;inset:6%;border-radius:50%;border:5px solid rgba(255,232,140,.9);opacity:0;pointer-events:none}
#playBtn.live .rp{animation:ripple 2.2s ease-out infinite}
@keyframes ripple{0%{transform:scale(.95);opacity:.8}100%{transform:scale(1.45);opacity:0}}
#credits{position:fixed;right:10px;bottom:6px;font-size:11px;font-weight:500;color:rgba(255,255,255,.95);text-shadow:0 1px 2px rgba(20,10,60,.8);pointer-events:none;transition:opacity .4s ease-out}
#credits.hide{opacity:0;transition:opacity .3s ease-in}

/* ---------- end ---------- */
#endUI{position:fixed;left:50%;bottom:5vh;transform:translate(-50%,30px);display:flex;gap:3vmin;align-items:center;opacity:0;pointer-events:none;transition:opacity .25s ease-in,transform .25s ease-in}
#endUI.on{opacity:1;transform:translate(-50%,0);pointer-events:auto;transition:opacity .5s cubic-bezier(.22,1,.36,1),transform .5s cubic-bezier(.34,1.4,.64,1)}
.rbtn{width:clamp(76px,14vmin,124px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 34% 26%,#ffe1a1 0 7%,#ffb03b 26%,#ff8a0d 58%,#ef6400 100%);box-shadow:0 0 0 .6vmin #fff,0 1vmin 0 .6vmin #b84e00,0 2.2vmin 4vmin rgba(20,10,60,.4)}
.rbtn svg{width:48%;height:48%}

/* ---------- rotate hint + loading ---------- */
#rotate{position:fixed;inset:0;display:none;place-items:center;text-align:center;background:rgba(20,12,60,.88);color:#fff;font-weight:700;font-size:22px;padding:30px;z-index:20}
#rotate .ph{width:70px;height:110px;border:6px solid #fff;border-radius:16px;margin:0 auto 20px;animation:rot 2s ease-in-out infinite}
@keyframes rot{40%,70%{transform:rotate(90deg)}}
#rotate button{margin-top:22px;padding:10px 22px;border-radius:99px;background:#fff;color:#4a2a8a;font-weight:700;font-size:17px}
@media (orientation:portrait) and (max-aspect-ratio:3/4){#rotate:not(.dismissed){display:grid}}
/* ---------- loading (js/loader.js): the start screen itself, with a horizontal bar where the Play button will appear ---------- */
html:not(.fit) #stage,html:not(.fit) #stageTop{visibility:hidden} /* (until fitStage has scaled it to the screen: no unscaled first frame) */
#world{opacity:0}                                      /* the painted scene fades in once it is laid out and has arrived */
#playBtn{opacity:0}                                    /* Title pops it in where the bar was */
#loadBar{position:absolute;left:536px;top:519px;width:600px;height:58px;transform-origin:50% 50%}   /* centred on TL.play */
#loadBar .lbTrack{position:absolute;inset:0;border-radius:99px;background:linear-gradient(#21144b,#3b2a86);box-shadow:0 0 0 5px #ffd23d,0 0 0 9px #d27400,0 14px 26px rgba(20,10,60,.42),inset 0 6px 10px rgba(0,0,0,.5)}
#loadBar .lbClip{position:absolute;left:8px;top:8px;right:8px;bottom:8px;border-radius:99px;overflow:hidden}
#loadBar .lbFill{position:absolute;inset:0;border-radius:99px;overflow:hidden;transform:translateX(-100%);background:linear-gradient(#fff27c,#ffc928 46%,#ff9412)}
#loadBar .lbStripes{position:absolute;top:0;bottom:0;left:-48px;width:calc(100% + 48px);background:repeating-linear-gradient(45deg,rgba(255,255,255,.32) 0 16.97px,rgba(255,255,255,0) 16.97px 33.94px)}
#loadBar .lbGloss{position:absolute;left:14px;right:14px;top:4px;height:36%;border-radius:99px;background:linear-gradient(rgba(255,255,255,.85),rgba(255,255,255,0))}
#loadBar .lbFlash{position:absolute;inset:-16px -10px;border-radius:99px;opacity:0;pointer-events:none;background:radial-gradient(closest-side,rgba(255,255,236,1),rgba(255,240,170,.75) 62%,rgba(255,240,170,0))}
#loadBar .lbBall{position:absolute;left:0;top:50%;width:74px;height:74px;margin:-37px 0 0 -37px;transform:translateX(29px);filter:drop-shadow(0 5px 5px rgba(20,10,60,.45))}
#loadText{position:absolute;left:436px;top:600px;width:800px;display:flex;justify-content:center;gap:.28em;color:#fff;font-weight:700;font-size:38px;line-height:1.2;letter-spacing:.01em;opacity:0;pointer-events:none;
  -webkit-text-stroke:8px #2a1c5c;paint-order:stroke fill;text-shadow:0 5px 8px rgba(20,10,60,.45)}
#loadText .lbPct{min-width:2.6em;text-align:left}
#flash{position:fixed;inset:0;background:radial-gradient(circle at 50% 25%,rgba(255,255,240,.85),rgba(255,255,255,0) 60%);opacity:0;transition:opacity .5s;pointer-events:none}
#flash.on{opacity:1;transition:opacity .08s}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;animation-delay:0s !important;transition-duration:.01ms !important;transition-delay:0s !important}
  #flash{display:none}
}
</style>
</head>
