<style>
:root{--ink:#1a1740;--gold:#ffcb3d;--orange:#ff9418;--plum:#2a1c5c;--glass:rgba(28,19,78,.88);--glass-hi:rgba(48,34,120,.94)}
*{box-sizing:border-box;margin:0;padding:0}
/* one typeface, one weight: Poppins SemiBold (600), embedded by build.sh. No outlines on text, no fake bold */
html,body{width:100%;height:100%;overflow:hidden;background:#0198fc;font-family:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-weight:600;font-synthesis:none;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;color:var(--ink)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
img{-webkit-user-drag:none;user-select:none}
#viewport{position:fixed;inset:0;overflow:hidden;background:linear-gradient(#0198fc,#0aa3fc 22%,#53c9fd 32%,#96eefd 38%,#00b1a6 50%,#ec9e4c 70%,#d8853b)} /* (the picture's colours, until it has loaded) */
#stage{position:absolute;left:0;top:0;width:1672px;height:941px;transform-origin:0 0}
#world{position:absolute;left:0;top:0;width:1672px;height:941px;transform-origin:0 0;will-change:transform}
.spr{position:absolute;display:block;pointer-events:none}
/* ---------- background: the user's deck picture (art/background/new_background.png), cut into parallax layers by
   tools/cut_deck_bg.py (bg units = the 1672×941 frame; Stage scales it to cover). At rest the layers stack back into
   the picture exactly. Each one also goes on a little under the layer in front of it, for the camera's parallax
   (PARALLAX in src/30_stage.js). The boxes are the ones that tool prints. ---------- */
#bg{position:absolute;left:0;top:0;width:1672px;height:941px;transform-origin:0 0;pointer-events:none}
#bg .bl{position:absolute;display:block;max-width:none;pointer-events:none}
/* the sky without its clouds: a smooth gradient, saved at 1/4 size and stretched. The only cloud in the game is the
   equation's (the user removed the painted ones on 19 Nov) */
#bgSky{left:0;top:0;width:1672px;height:941px}
/* the sun, top right (SUN in src/32_scenery.js places it): the sky brightening toward it, its bloom, two
   counter-turning glare layers (sun_glow / sun_rays from tools/make_sun.py), a lens streak and the white disc */
#bgSun{left:0;top:0;width:0;height:0}
#bgSun>*{position:absolute;display:block;max-width:none;pointer-events:none}
#bgSun .sk{left:-850px;top:-850px;width:1700px;height:1700px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,253,234,.55),rgba(255,250,222,.28) 22%,rgba(255,250,222,.1) 55%,rgba(255,250,222,0))}
#bgSun .sg{left:-380px;top:-380px;width:760px;height:760px;animation:sglow 5.5s ease-in-out infinite alternate}
#bgSun .sr{left:-500px;top:-500px;width:1000px;height:1000px;opacity:.6}
#bgSun .r1{animation:sspin 210s linear infinite,sbreath 4.7s ease-in-out infinite alternate}
#bgSun .r2{transform:scaleX(-1) rotate(17deg);animation:sspin2 270s linear infinite,sbreath 6.3s -3s ease-in-out infinite alternate-reverse}
#bgSun .ss{left:-320px;top:-2.5px;width:640px;height:5px;border-radius:50%;opacity:.5;background:linear-gradient(90deg,rgba(255,250,235,0),rgba(255,250,235,.25) 32%,rgba(255,255,255,.85) 50%,rgba(255,250,235,.25) 68%,rgba(255,250,235,0))}
#bgSun .sd{left:-28px;top:-28px;width:56px;height:56px;border-radius:50%;background:radial-gradient(closest-side,#fff 0,#fff 70%,rgba(255,255,250,.92) 80%,rgba(255,253,240,.4) 91%,rgba(255,250,232,0) 100%);animation:spulse 3.3s ease-in-out infinite alternate}
@keyframes sglow{from{opacity:.86}to{opacity:1}}
@keyframes sspin{to{transform:rotate(360deg)}}
@keyframes sspin2{from{transform:scaleX(-1) rotate(17deg)}to{transform:scaleX(-1) rotate(377deg)}}
@keyframes sbreath{from{opacity:.42}to{opacity:.82}}
@keyframes spulse{to{transform:scale(1.07)}}
/* birds: a few, now and then, in the sky either side of the cloud, never across it, gliding down into the treetops
   or rising out of them (Birds in src/32_scenery.js flies each one; GSAP, so they stop on pause). Each flaps a few
   times, then glides, rising a little on the beats */

/* ---------- the equation cloud: the question sits right on the cloud ---------- */
/* (far off in the sky: Cloud.apply draws it, label and equation included, at CLOUD_FAR. Its top sits clear under
   the question board at the top of the screen (#capPos; the user, 26 Nov 2026: "the panel in upper side of the
   cloud… should not overlap with the cloud"), also while the camera leans in: CLOUD_HIT / CLOUD_MID follow it) */
#cloud{position:absolute;left:500px;top:108px;width:656px;height:300px;transform-origin:50% 62%;will-change:transform}
/* the cloud art (tools/paint_cloud.py): painted like the clouds of the deck picture, so it belongs to that sky: a big
   dome, puffs stepping down, a soft blue underside that melts into the sky (no thin wisps running out of it: the
   user, 26 Nov 2026, "fix the string of the cloud… it should blend with the background"); lit by the sun */
#cloud .cl{position:absolute;left:-52px;top:10px;width:760px;height:281px}
/* its warm rim light on the sun's side (tools/cloud_rim.py: a picture laid exactly over it) and a soft haze where it
   meets the sky (design review, 23 Nov 2026: "a warm rim light on the sun side (top right), and a soft haze where it
   meets the sky"); both come and go with the cloud's picture (CloudBurst.clOp) */
#cloud .clr{position:absolute;left:-52px;top:10px;width:760px;height:281px;pointer-events:none}
#cloud .chz{position:absolute;left:-90px;top:132px;width:836px;height:230px;border-radius:50%;pointer-events:none;background:radial-gradient(closest-side,rgba(242,251,255,.62),rgba(242,251,255,.3) 52%,rgba(242,251,255,0))}
/* No box: the question sits right on the cloud (the user asked to remove the card on 19 Nov). During play there is no
   label, only the equation (the user removed "Find the value of x" on 19 Nov); at the end a small dark label
   (the same dark glass + gold ring as Skip and the caption) reads "Your score", under the cloud's top bump. The equation
   sits in the middle of the cloud's body (its centre of mass), always fitted inside the cloud (EqUI.maxW / maxH).
   Measured on cloud.webp (tools/paint_cloud.py, repainted 25 Nov), in #cloud box px: the body is solid from x 112 to
   570 below y 140 and from x 106 to 574 below y 160, down to its flat base at y 272; its middle is x 328 */
#qCard{position:absolute;left:0;top:0;width:656px;height:0;pointer-events:none}
#qTab{position:absolute;left:328px;top:80px;translate:-50% -50%;padding:7px 24px;border-radius:99px;background:var(--glass);box-shadow:0 0 0 3px #ffd23d,0 5px 12px rgba(20,10,60,.24);color:#fff;font-size:25px;line-height:1.2;letter-spacing:.01em;white-space:nowrap}
#qTab:empty{display:none}
#eqBox{position:absolute;left:328px;top:178px;width:0;height:0} /* (the middle of the cloud's body) */
/* the equation and the question board's words: Poppins Bold (700), as in the user's Distance Formula game (the user,
   26 Nov 2026: "use Poppins, like distance formula… we are using x like this"); its x is set as mathematics, as
   Distance Formula sets it (.xv, #cap .mx). The orbs' numbers keep Trig Text (the user's font, 19 Nov), its one weight */
#eq,#cap .txt{font-family:'Poppins',system-ui,sans-serif;font-weight:700}
.ball b{font-family:'Trig Text','Poppins',system-ui,sans-serif;font-weight:400}
#eq{position:absolute;left:0;top:0;transform:translate(-50%,-50%);display:flex;align-items:center;white-space:nowrap;font-size:84px;line-height:1;letter-spacing:-.01em;font-variant-numeric:lining-nums;color:var(--ink);transform-origin:0 0}
#eq.wob{animation:eqwob .45s ease-in-out 3}
@keyframes eqwob{25%{rotate:-3deg}75%{rotate:3deg}}
.tk{display:inline-flex;align-items:center;justify-content:center;position:relative;flex:none}
/* x: the letter, in x's own violet (its cage stands on the deck), set as mathematics the way Distance Formula sets
   it: Latin Modern Math's italic x (TeX's own; 'Swifty Math', build.sh), its own weight, never a made-up bold. A
   little larger than the words round it, so its small TeX x-height stands as tall as Poppins' */
.xv{color:#7a22d6;margin:0 .06em 0 .02em;font-family:'Swifty Math','Poppins',system-ui,sans-serif;font-style:italic;font-weight:400;font-synthesis:style;font-size:1.22em}
.op{margin:0 .17em}
.eqs{margin:0 .24em}
.paren{transform:scaleY(1.12);margin:0 .02em}
.frac{display:inline-flex;flex-direction:column;align-items:center;font-size:.78em;margin:0 .06em}
.frac>.fn,.frac>.fd{display:flex;align-items:center;justify-content:center;padding:0 .12em}
.frac>.fb{align-self:stretch;height:.08em;min-height:4px;border-radius:9px;background:currentColor;margin:.08em 0}
.ng{margin-right:.04em}
/* ÷ drawn to the same stroke weight as Poppins SemiBold's + − = */
.dv{display:inline-block;position:relative;width:.56em;height:.62em;flex:none}
.dv::before{content:'';position:absolute;left:.02em;right:.02em;top:calc(50% - .045em);height:.09em;background:currentColor;border-radius:1em}
.dv::after{content:'';position:absolute;left:50%;top:.04em;width:.13em;height:.13em;margin-left:-.065em;border-radius:50%;background:currentColor;box-shadow:0 .41em 0 currentColor}
/* in Trig Text (the equation, the orbs) the font's own ÷ matches its digits, so the drawn one gives way to it */
#eq .dv,.ball b .dv{width:auto;height:auto}
#eq .dv::before,.ball b .dv::before{content:'÷';position:static;background:none;height:auto;border-radius:0}
#eq .dv::after,.ball b .dv::after{content:none}
.inc{color:var(--tok)}
.inc .op{margin:0 .12em 0 .17em}
.hid{opacity:0;transform:scale(.4)}
/* a term arriving: fades up from 40 % with a small overshoot (back.out ~1.25), then rests */
.pop{animation:pop .6s cubic-bezier(.3,1.3,.6,1) both}
@keyframes pop{0%{opacity:0;transform:scale(.4)}40%{opacity:1}100%{opacity:1;transform:scale(1)}}
/* the terms about to combine light up together: one soft gold pill behind each side's group, so "+5 −5" reads as
   one group and "7 −5" as another (EqUI.pair places it, in #eq's own units, under the terms) */
.hlg{position:absolute;box-sizing:content-box;padding:.06em .16em;margin:-.06em 0 0 -.16em;border-radius:.3em;pointer-events:none;
  background:linear-gradient(#fff0b0,#ffe07a);box-shadow:0 0 0 .035em rgba(255,176,30,.5),0 .05em .14em rgba(170,100,0,.16);animation:hlin .55s cubic-bezier(.22,1,.36,1) both}
.hlg.out{animation:hlout .7s ease-in forwards}
@keyframes hlin{from{opacity:0;transform:scale(.86,.5)}to{opacity:1;transform:none}}
@keyframes hlout{from{opacity:1}to{opacity:0}}
/* terms that cancel: a small lift, then shrink + fade (ease-in; its length is set from Motion.BEAT.CANCEL, which the timeline waits for) */
.van{animation:van .7s cubic-bezier(.5,0,.75,.45) forwards}
@keyframes van{0%{opacity:1;transform:none}30%{opacity:1;transform:scale(1.06) translateY(-.04em)}100%{opacity:0;transform:scale(.35) translateY(-.08em)}}
.msg{display:flex;flex-direction:column;align-items:center;color:#7b2ff0}
.msg .m1{font-size:.5em;color:var(--ink);letter-spacing:.01em}
.msg .m2{font-size:1em;margin-top:.04em}
/* x's moods (Sprite in src/30_stage.js, the user's art of 23 Nov): a row of frames seen through a window one frame
   wide (.mood); the row slides along a frame at a time (transform). The window's shape is its frame's (aspect-ratio,
   inline). (Not .spr: that is the plain placed picture, the orbs' tray for one) */
.mood{display:block;position:relative;overflow:hidden;height:100%;flex:none}
.mood>img{position:absolute;left:0;top:0;height:100%;width:auto;max-width:none;display:block;pointer-events:none;-webkit-user-select:none;user-select:none}
/* the cage around x (x in it, crying: its window .cg) */
.cage{height:1.72em;margin:0 .02em}
.cage .cg{transform-origin:50% 90%}
.cage.push .cg{animation:cpush 1.2s ease-in-out 2}
@keyframes cpush{0%,100%{transform:none}20%{transform:translateX(-4%) rotate(-5deg)}35%{transform:translateX(-5%) scaleX(.96)}55%{transform:translateX(4%) rotate(5deg)}70%{transform:translateX(5%) scaleX(.96)}}
.cage.rattle .cg{animation:rattle .16s ease-in-out 7} /* (a rocking "not yet", ~6 per second: 11 per second read as jitter) */
@keyframes rattle{25%{transform:translateX(-6%) rotate(-6deg)}75%{transform:translateX(6%) rotate(6deg)}}
.cage.glowx .cg{filter:drop-shadow(0 0 10px #fff) drop-shadow(0 0 24px #c58bff)}
.cage.open .cg{animation:copen .5s ease-out}
@keyframes copen{40%{transform:scale(1.15) rotate(-6deg)}}
/* freed: the cage cracks open and x comes out (CageBreak in src/30_stage.js moves them all by transform + opacity).
   The cage's own picture stays in the equation unseen, so nothing in the line moves; a glow behind the cage builds
   with x's pushes and flares out at the break; its cracks are drawn on a canvas over it (.ccrk, masked by the cage
   as it shows round x); behind it a fan of golden light rays (.crays: one conic gradient, turned by transform) wakes
   with the pushes, flares at the break and stays as a soft halo behind x; its shards fly on the FX canvas. The free x
   (the dance's frames; its box, taller than x, is sized by CageBreak.prep) stands where it stood in the cage, 75 % of
   the cage's height, and dances there (its window hops and squashes about x's feet, the box's foot); its white twin
   (.xwhite) lies over it and fades as x rises out of the light */
.cage .caura{position:absolute;left:-40%;top:-22%;width:180%;height:144%;z-index:-1;border-radius:50%;opacity:0;pointer-events:none;
  background:radial-gradient(closest-side,rgba(255,255,255,.95),rgba(255,240,170,.62) 38%,rgba(197,139,255,.34) 66%,rgba(197,139,255,0))}
.cage .ccrk{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;transform-origin:50% 90%}
.cage .crays{position:absolute;left:50%;top:50%;width:6.8em;height:6.8em;z-index:-2;border-radius:50%;opacity:0;pointer-events:none;will-change:transform,opacity;transform:translate(-50%,-50%);
  background:repeating-conic-gradient(from 0deg,rgba(255,190,40,0) 0deg,rgba(255,200,60,.7) 5deg,rgba(255,226,130,0) 11deg,rgba(255,226,130,0) 22.5deg);
  -webkit-mask-image:radial-gradient(closest-side,#000 10%,rgba(0,0,0,.55) 42%,transparent 76%);mask-image:radial-gradient(closest-side,#000 10%,rgba(0,0,0,.55) 42%,transparent 76%)}
.cage .xfree{position:absolute;left:50%;top:50%;height:79.4%;aspect-ratio:491/396;visibility:hidden;pointer-events:none;transform-origin:50% 100%;transform:translate(-50%,-50%);
  filter:drop-shadow(0 0 8px #fff) drop-shadow(0 0 18px rgba(197,139,255,.85))}
.cage .xfree .mood{width:100%;transform-origin:50% 100%}
.cage .xfree.xwhite{filter:brightness(0) invert(1) drop-shadow(0 0 10px #fff) drop-shadow(0 0 22px #ffe9a0)}
/* x's cage on the deck (DeckCage), right of the cannon: the crying frames, 262 px tall; its font-size (set by
   DeckCage) makes the cage 1.72 em, as the .cage rules above expect */
#deckCage{position:absolute;pointer-events:none;transform-origin:50% 100%}
#deckCage>.cage{display:block;position:relative;width:100%;height:100%;margin:0}
/* (no "x" tag on the cage: the user, 25 Nov 2026, "remove the X and sound icon… from this entire game") */
#world.title #deckCage{visibility:hidden}
/* the end screen's x and its broken cage (EndX): in the middle of the deck; placed and sized by EndX, moved about
   their feet */
.xEnd{position:absolute;pointer-events:none;transform-origin:50% 100%}
.xEnd>img{display:block;width:100%;height:100%}
.xEnd>.mood{transform-origin:50% 100%}
/* "x = 2" lights up as the equation is solved, growing 18 % with a gold glow */
.tk.win{color:#7a22d6;text-shadow:0 0 16px rgba(255,214,70,.85),0 0 32px rgba(255,180,30,.5);animation:winpop .8s cubic-bezier(.22,1,.36,1) both,winglow 1.4s .85s ease-in-out infinite}
@keyframes winpop{0%{transform:scale(1)}45%{transform:scale(1.3)}100%{transform:scale(1.18)}}
@keyframes winglow{0%,100%{transform:scale(1.18)}50%{transform:scale(1.26)}}
/* the cloud bursting (CloudBurst): the pieces of its own picture, laid exactly over it, each with its blurred twin */
.cbits{position:absolute;pointer-events:none}
.cbits .cb{position:absolute;visibility:hidden}
.cbits canvas{position:absolute;display:block}
/* the light in the cloud's heart (Cloud.core): it builds as the cloud draws in its breath before the cloudburst, and
   flashes out at the pop. Warm, so it shows on the white cloud */
#cloud .ccore{position:absolute;left:340px;top:200px;width:600px;height:320px;margin:-160px 0 0 -300px;border-radius:50%;opacity:0;pointer-events:none;
  background:radial-gradient(closest-side,rgba(255,255,255,1),rgba(255,246,206,.92) 26%,rgba(255,214,110,.55) 55%,rgba(255,200,90,0))}
/* the vignette (Vignette): the screen's edges darken while the cage cracks, so the eye goes to it */
#vig{position:fixed;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse 72% 68% at 50% 36%,rgba(16,8,46,0) 42%,rgba(16,8,46,.42) 78%,rgba(16,8,46,.7) 100%)}

/* ---------- cannon, sockets, FIRE ---------- */
#cannon{position:absolute;left:0;top:0}
#cannonBody,#cannonFrontBody{position:absolute;width:0;height:0;transform-origin:0 0}
#cannonBody img,#cannonFrontBody img{position:absolute;bottom:0;transform:translateX(-50%);left:0}
#cannonFront{position:absolute;left:0;top:0;pointer-events:none}
/* a loaded socket's dark lining (the hole's art is lit at the bottom, which made the ball look pushed up): an even,
   deep socket all round the ball, a little darker under the ring's top lip */
.sbk{position:absolute;display:block;border-radius:50%;pointer-events:none;opacity:0;transition:opacity .2s ease-out;
  background:radial-gradient(circle at 50% 46%,#2b1306 0,#1a0903 58%,#0d0401 100%);box-shadow:inset 0 5px 7px rgba(0,0,0,.65)}

/* the order the two sockets fire in, only in the first two-socket round (Cannon.showOrder): Skip's dark glass + gold */
.stag{position:absolute;translate:-50% -50%;min-width:46px;height:46px;padding:2px 12px 0;border-radius:99px;display:grid;place-items:center;background:var(--glass);color:#fff;font-size:28px;line-height:1;box-shadow:0 0 0 2.5px rgba(255,210,61,.92),0 5px 12px rgba(20,10,60,.3);pointer-events:none}

#fireBtn{position:absolute;cursor:pointer;transition:transform .12s ease-out;transform-origin:50% 60%}

#fireBtn .gr{filter:grayscale(1) brightness(.55) contrast(.9);opacity:0;transition:opacity .25s ease-in}#fireBtn.off .gr{opacity:1;transition-timing-function:ease-out}

/* the word on the button (the pill art is blank): T('btnFire'). Both cannons' pills are yellow (the user's art,
   23 Nov), their painted word white with a thin brown edge and a soft shadow, so the game's word gets the same; the
   grey "off" picture is dark, so the white word still reads. Cannon sets its size from the button's height and
   shrinks it to fit a longer word. Its capitals sit a touch above the pill's middle, as the painted word did (the
   pill's orange bottom edge makes its yellow face sit high) */
#fireBtn .ft{position:absolute;left:50%;top:50%;transform:translate(-50%,-49%);color:#fff;line-height:1;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap;pointer-events:none;text-shadow:0 0 .03em #94430a,0 0 .03em #94430a,0 .05em 0 #8a3c06,0 .07em .12em rgba(110,45,0,.45)}

#fireBtn::before{content:'';position:absolute;inset:-32% -6%} /* (a taller tap area: the pill is short on a phone) */

.ball{position:absolute;left:0;top:0;width:110px;height:110px;margin:-55px 0 0 -55px;cursor:grab;touch-action:none} /* = BALL_D */
/* a ball in the player's hand (Drag): it rides in #fly, above everything, with a soft shadow dropped below it */

.ball .hr{position:absolute;inset:2%;border-radius:50%;pointer-events:none;opacity:0;box-shadow:0 0 0 5px #ffe46b,0 0 12px 5px rgba(255,200,40,.8),inset 0 0 10px 2px rgba(255,240,160,.75)}
.ball .hr.on{animation:hg 1s ease-out 1 both}
@keyframes hg{0%{opacity:0;transform:scale(.94)}25%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.03)}}
.ball.gone{display:none}
/* the orbs' tap area reaches a little past each orb (not into the next one), so it stays 44 px or more on a small phone */
.ball::before{content:'';position:absolute;inset:-7%;border-radius:50%}
/* the faint ghost of an orb in its cup while it is away (Rack.ghosts) */
.bghost{position:absolute;width:110px;height:110px;margin:-55px 0 0 -55px;opacity:0;transition:opacity .25s ease-out;pointer-events:none}
.bghost img{display:block;width:100%;height:100%;filter:saturate(.3) brightness(1.2)}
.bghost.on{opacity:.24}
.ball .ao{position:absolute;inset:3%;border-radius:50%;background:radial-gradient(ellipse 70% 32% at 50% 90%,rgba(66,26,4,.5),rgba(66,26,4,.2) 58%,rgba(66,26,4,0) 100%);opacity:0;transition:opacity .25s;pointer-events:none}
.ball.seated .ao{opacity:1}
/* in the cannon's socket the orb fills the hole edge to edge: only a soft shade where the ring's top lip overhangs
   it (none round the sides or the bottom, so no dark band reads as a gap between the orb and the ring) */
.ball.insock .ao{opacity:1;inset:2%;background:radial-gradient(circle at 50% 64%,rgba(40,14,0,0) 60%,rgba(40,14,0,.22) 80%,rgba(40,14,0,.34) 100%)}
.bshadow{position:absolute;width:0;height:0;opacity:0;transition:opacity .25s;pointer-events:none} /* at the seated ball's centre */
.bshadow.on{opacity:1}
.bshadow i{position:absolute;border-radius:50%}
.bshadow .cast{left:-31px;top:-52px;width:112px;height:112px;background:radial-gradient(closest-side,rgba(52,18,0,.58),rgba(52,18,0,.5) 70%,rgba(52,18,0,0))} /* on the back wall, down-right of the ball */
.bshadow .pool{left:-65px;top:25px;width:133px;height:29px;background:radial-gradient(closest-side,rgba(36,10,0,.9),rgba(36,10,0,.6) 58%,rgba(36,10,0,0))} /* where the ball meets the trough, just above the rail */
/* ---------- ground contact: shadow groups multiply onto the plaza; light + ring groups paint normally so colour reads on bright sand ---------- */
#ground{position:absolute;left:0;top:0;width:0;height:0;pointer-events:none}
.gsh{position:absolute;left:0;top:0;width:0;height:0;transform-origin:0 0;pointer-events:none}
.gsh.shadow{mix-blend-mode:multiply}
.gsh i{position:absolute;display:block;border-radius:50%}
/* (warm brown: the cannon and tray stand on a wooden deck) */
.gsh .soft{background:radial-gradient(closest-side,rgba(70,36,10,.7),rgba(70,36,10,.42) 45%,rgba(70,36,10,0));filter:blur(6px)}
.gsh .cast{background:radial-gradient(closest-side,rgba(70,36,10,.45),rgba(70,36,10,.24) 50%,rgba(70,36,10,0));filter:blur(9px)}
.gsh .pool{background:radial-gradient(closest-side,rgba(66,32,8,.72),rgba(66,32,8,.6) 55%,rgba(66,32,8,.3) 82%,rgba(66,32,8,0));filter:blur(7px)} /* (a wide, even shadow that spreads past a base: start screen) */
.gsh .contact{background:radial-gradient(closest-side,rgba(40,18,4,.95),rgba(40,18,4,.62) 50%,rgba(40,18,4,0));filter:blur(2px)}
.gsh .ao{background:radial-gradient(closest-side,rgba(30,12,2,.95),rgba(30,12,2,.75) 60%,rgba(30,12,2,0));filter:blur(1.5px)} /* (where a base meets the boards: start screen) */
.gsh .glow{background:radial-gradient(closest-side,rgba(90,236,255,.62),rgba(90,236,255,.28) 50%,rgba(90,236,255,0));filter:blur(2px)}
.gsh .gold{border:3px solid rgba(255,248,205,.95);box-shadow:0 0 6px 2px rgba(255,214,70,.95),0 0 18px 7px rgba(255,176,20,.65),inset 0 0 8px 2px rgba(255,214,70,.8)}

/* ---------- caption (what the voice says): the user's question template, at the top in the middle ----------
   art/ui/question_template.png (an orange wooden frame, dark-brown outline, cream panel), cut by
   tools/cut_question_board.py at 0.5 into assets/img/question_board.webp (1070×272) and painted as a 9-slice at 0.25
   (half the WebP, so it stays sharp on a 2× screen) into the canvas .bg by Caption.paint (src/20_audio.js), in whole
   device pixels so the pieces meet without seams. That is the template's own proportions: the whole thick wooden
   frame and its grain show; the corners stay as drawn and only straight frame and cream stretch to the words. The
   words (36px) sit in the cream panel, whose inset at 0.25 is 24 / 19 / 19.5 / 18.5 px (top right bottom left), as
   far from its left edge as from its right (no speaker icon: the user, 25 Nov 2026). Dark-brown words on the cream, so they always read. It hugs its words
   (Caption.fit: as wide as its longest line) and hangs from the top of the screen, in the middle, between the pause /
   sound buttons and Skip, above the cloud and never over it (the user, 26 Nov 2026: "the question panel should come
   in top between… adjust the panel in upper side of the cloud… should not overlap with the cloud"); at most 1000
   wide, so every line is one row and the board stays one row tall (#capPos, in #stageTop: above the FX canvas, so
   cannon smoke never hides the words). On the end screen, whose title has the top, it waits on the left, halfway
   down, as before (#capPos.end). It shows only while a voice line is being said: it drops in as the voice starts,
   each word pops in as it is said, it glides between lines and lifts away after the line (transform + opacity) */
#overlay{position:absolute;inset:0;pointer-events:none}
#capPos{position:absolute;left:0;top:10px;width:1672px;height:0;display:flex;justify-content:center;align-items:flex-start;pointer-events:none}
#cap{position:relative;flex:none;max-width:1000px;padding:40px 42px 35px 42px;color:#4a2508;font-size:36px;line-height:1.3;letter-spacing:.005em;opacity:0;transform-origin:50% 0}
/* (the end screen: on the left, halfway down, at most 450 wide, so the end line wraps clear of x's broken cage) */
#capPos.end{left:30px;top:470px;width:auto;justify-content:flex-start;align-items:center}
#capPos.end #cap{max-width:450px;transform-origin:0 50%}
#cap .bg{position:absolute;left:0;top:0;width:100%;height:100%;display:block;transform-origin:0 0;filter:drop-shadow(0 7px 9px rgba(40,18,4,.3))}
#cap .txt{display:block;position:relative;text-wrap:balance}
/* its words come one by one with the voice (Caption.upTo): each is its own box so it can pop in (transform +
   opacity); a one-letter word (x) and the word after it share a .nw group, so x never ends a row */
#cap .w{display:inline-block;opacity:0}
#cap .nw{white-space:nowrap}
/* the letter x in the board's words, set as mathematics as on the cloud (Caption.lay wraps it) */
#cap .mx{font-family:'Swifty Math','Poppins',system-ui,sans-serif;font-style:italic;font-weight:400;font-synthesis:style;font-size:1.22em;line-height:0;margin:0 .03em}


/* ---------- HUD (from the art: pause, sound) ---------- */
#hud{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .3s ease-out}
/* ---------- spotlight tutorial: a light dim over everything except the focus, and NO blur (user, 23 Nov: the blur
   hid the equation; it must stay readable in every step) ----------
   up to two clear holes (--x/--y/--rx/--ry, and --x2/… for a second one, parked off screen when unused): each mask
   layer is clear inside its hole, and the two are intersected, so both holes stay clear */
#spot{position:absolute;left:0;top:0;width:0;height:0;pointer-events:none}
#spot .sl{position:absolute;inset:0;opacity:0;--x:0px;--y:0px;--rx:100px;--ry:100px;--x2:-9999px;--y2:-9999px;--rx2:1px;--ry2:1px;
  background:rgba(14,10,42,.36);
  -webkit-mask-image:radial-gradient(ellipse var(--rx) var(--ry) at var(--x) var(--y),transparent 0,transparent 78%,#000 100%),radial-gradient(ellipse var(--rx2) var(--ry2) at var(--x2) var(--y2),transparent 0,transparent 78%,#000 100%);
  mask-image:radial-gradient(ellipse var(--rx) var(--ry) at var(--x) var(--y),transparent 0,transparent 78%,#000 100%),radial-gradient(ellipse var(--rx2) var(--ry2) at var(--x2) var(--y2),transparent 0,transparent 78%,#000 100%);
  -webkit-mask-composite:source-in;mask-composite:intersect}
/* the drag lesson's see-through ball (Spot.demo): a copy of the −5 with a soft light round it */
#spotGhost{pointer-events:none;cursor:default;opacity:0}
#spotGhost img{filter:drop-shadow(0 0 8px rgba(255,248,200,.95)) drop-shadow(0 0 18px rgba(255,214,70,.6))}
#spotRing,#spotRing2{position:absolute;left:0;top:0;width:200px;height:200px;border-radius:50%;pointer-events:none;opacity:0;
  border:5px solid rgba(255,228,120,.95);box-shadow:0 0 16px 5px rgba(255,196,50,.55),inset 0 0 12px 3px rgba(255,220,100,.35)}
#spotHand{position:absolute;left:0;top:0;width:90px;height:126.9px;margin:-32.6px 0 0 -34.4px;display:block;max-width:none;pointer-events:none;opacity:0;transform-origin:34.4px 32.6px;filter:drop-shadow(0 6px 7px rgba(20,10,60,.35))} /* your hand (art/ui/hand.webp); its fingertip is the point that taps */
body.spot #hud.on{opacity:.5}
#hud.on{opacity:1}
.hbtn{position:absolute;top:max(10px,2.4vh);width:clamp(46px,5.3vw,96px);aspect-ratio:132/133;pointer-events:auto;transition:transform .12s;filter:drop-shadow(0 4px 6px rgba(0,0,0,.18))}
.hbtn img{width:100%;height:100%;display:block}
.hbtn:active{transform:scale(.9)}
#pauseBtn{left:max(10px,2vw)}
#sndBtn{left:calc(max(10px,2vw) + clamp(46px,5.3vw,96px) + max(8px,1vw))}
/* on the start screen only the sound button shows, in the first place (design review: "put the sound toggle here so a
   classroom can mute before starting"); it glides to its place beside Pause when the game starts */
#hud.ttl{opacity:1}
#hud.ttl>*:not(#sndBtn){visibility:hidden}
#hud.ttl #sndBtn{translate:calc(-1 * (clamp(46px,5.3vw,96px) + max(8px,1vw))) 0}
#sndBtn{transition:transform .12s,translate .45s cubic-bezier(.22,1,.36,1)}
#sndBtn.muted::after{content:'';position:absolute;left:14%;right:14%;top:47%;height:9%;background:#e8132b;border-radius:9px;transform:rotate(-40deg);box-shadow:0 0 0 3px #fff}
/* Skip: always in the same place, top right, level with Pause and Sound; it only fades (Skip in src/12_motion.js). (No
   progress dots: the user took them out of the game, 25 Nov 2026) */
#skipBtn{position:absolute;top:max(10px,2.4vh);right:max(10px,2vw);height:clamp(40px,4.4vw,58px);padding:0 clamp(14px,1.5vw,22px) 0 clamp(16px,1.7vw,24px);display:flex;align-items:center;gap:.4em;border-radius:99px;background:var(--glass);color:#fff;font-size:clamp(16px,1.7vw,23px);line-height:1;letter-spacing:.01em;box-shadow:0 0 0 2px rgba(255,210,61,.85),0 6px 16px rgba(20,10,60,.24);opacity:0;pointer-events:none;transition:background-color .15s ease-out,scale .12s ease-out}
#skipBtn.on{pointer-events:auto}
#skipBtn:hover{background:var(--glass-hi)}
#skipBtn:active{scale:.95} /* (scale, not transform: GSAP owns its transform for the enter/exit) */
#skipBtn span{padding-top:.08em}
#skipBtn svg{width:.9em;height:.9em;flex:none}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
/* flying balls ride above the particles (so a ball and its label read through the muzzle blast), in a copy of
   the stage + camera transform that Stage keeps in step with the world */
#stageTop{position:absolute;left:0;top:0;width:1672px;height:941px;transform-origin:0 0;pointer-events:none}
#worldTop{position:absolute;left:0;top:0;width:1672px;height:941px;transform-origin:0 0;will-change:transform;pointer-events:none}
/* glows whose opacity breathes all the time get their own layer, so they never repaint the plaza */
.gsh.light{will-change:opacity}
#thumb.live .gsh{will-change:transform,opacity}

/* ---------- start screen: the user's mockup (art/start_screen/start_mockup.png), see src/35_title.js ---------- */
#world.title #cloud,#world.title #cannon,#world.title #rack,#world.title #rackFront,#world.title #balls,#world.title #bshadows,#world.title #ground,#world.title #cannonFront{visibility:hidden}
#thumb{position:absolute;inset:0;pointer-events:none}
#thumb.gone{display:none}
.tp{position:absolute;display:block;transform-origin:50% 50%;pointer-events:none}
#thumb.live .tp,#thumb.live #playBtn{will-change:transform,opacity}
.tp.lit{filter:brightness(1.2) drop-shadow(0 0 16px rgba(255,236,150,.9))}
/* the cannon group: its picture + a glint; the cage group: its whole picture, x's shadow on the floor, x, its front
   bars (x is inside, between them), a glint */
.tgrp img{position:absolute;display:block;max-width:none;pointer-events:none}
/* a glint (Title.glint): a soft slanted band of light; through it shows the piece's gold, washed bright */
.gband{position:absolute;left:0;top:0;overflow:hidden;transform-origin:0 0;opacity:0;pointer-events:none;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 30%,#000 70%,transparent);mask-image:linear-gradient(90deg,transparent,#000 30%,#000 70%,transparent)}
.gband img{left:0;top:0;transform-origin:0 0}
#thumb.live .gband,#thumb.live .gband img{will-change:transform,opacity}
.tcage .tcry{position:absolute;display:block} /* x crying in its cage (the game's own art: Sprite 'cry') */
#playBtn{position:absolute;pointer-events:auto;cursor:pointer;transform-origin:50% 50%}
#playBtn img{position:relative;width:100%;height:100%;display:block;pointer-events:none;filter:drop-shadow(0 6px 10px rgba(80,20,0,.35))}
#playBtn .pg{position:absolute;inset:-16%;border-radius:50%;pointer-events:none;opacity:0;background:radial-gradient(closest-side,rgba(255,226,120,.95),rgba(255,214,90,.55) 55%,rgba(255,214,90,0))}
#playBtn .rp{position:absolute;inset:6%;border-radius:50%;border:5px solid rgba(255,232,140,.9);opacity:0;pointer-events:none}
#playBtn.live .rp{animation:ripple 2.2s ease-out infinite}
@keyframes ripple{0%{transform:scale(.95);opacity:.8}100%{transform:scale(1.45);opacity:0}}

/* ---------- end ---------- */
/* the end screen (the user, 25 Nov 2026: "no need of this amazing panel… Quest complete, I want in a good text, in
   upper side, and in between I want X should be dancing… and the cage behind of the X"; it replaced the design
   review's results card): the title at the top, x dancing in the middle in front of its broken cage (EndX, in the
   world), and Play again + Home under it. In stage units (in #overlay); EndCard in src/40_game.js moves them,
   transform + opacity only.
   The title is lettered like the game's own logo (t_logo): chunky letters (Trig Text) with a glossy yellow-to-orange
   face, an orange edge under it, a thick dark-teal outline and a soft shadow. Each word is three layers of the same
   text: its face (.f, the gradient clipped to the letters) over its orange edge (::after) over the teal outline
   (::before, a text stroke), so no stroke ever crosses the face */
#endTitle{position:absolute;left:0;top:52px;width:1672px;display:flex;justify-content:center;gap:.24em;white-space:nowrap;pointer-events:none;font-family:'Trig Text','Poppins',system-ui,sans-serif;font-weight:400;font-size:116px;line-height:1.12;letter-spacing:.012em;opacity:0}
#endTitle .w{display:inline-block;position:relative;isolation:isolate;transform-origin:50% 85%} /* (isolated: its layers stack inside it) */
#endTitle .f{position:relative;display:block;color:transparent;background:linear-gradient(180deg,#fffbd6 4%,#ffe86a 26%,#ffd21c 50%,#ffae14 76%,#ff8c0a 96%);-webkit-background-clip:text;background-clip:text}
#endTitle .f::before,#endTitle .f::after{content:attr(data-t);position:absolute;left:0;top:0;z-index:-1;pointer-events:none}
#endTitle .f::after{color:#e8700a;transform:translateY(.05em)}
#endTitle .f::before{color:#0e5a62;-webkit-text-stroke:.15em #0e5a62;transform:translateY(.05em);filter:drop-shadow(0 .05em 0 #08424a) drop-shadow(0 .1em .09em rgba(8,28,48,.38))}
/* Play again + Home, under x (they only take taps once they're up). The title and the buttons are rows as wide as
   the stage, their content centred (GSAP moves them, so no CSS translate to centre them: it would be folded in) */
#endBtns{position:absolute;left:0;top:808px;width:1672px;display:flex;justify-content:center;align-items:center;gap:26px;opacity:0;pointer-events:none}
#endBtns.on .pill{pointer-events:auto}
.pill{display:flex;align-items:center;gap:10px;height:72px;padding:0 30px 0 22px;border-radius:99px;font-size:28px;line-height:1;color:#fff;background:linear-gradient(#ffb03b,#ff8a0d 55%,#ef6400);box-shadow:0 0 0 4px #fff,0 6px 0 4px #b84e00,0 12px 20px rgba(20,10,60,.3);transition:transform .15s ease-out,filter .15s ease-out}
.pill.alt{background:linear-gradient(#6b5bd6,#4b3aa8 55%,#3a2b8c);box-shadow:0 0 0 4px #fff,0 6px 0 4px #241868,0 12px 20px rgba(20,10,60,.3)}
.pill svg{width:34px;height:34px;flex:none}
.pill:hover{transform:translateY(-2px);filter:brightness(1.07)}
.pill:active{transform:translateY(2px) scale(.97)}
/* Play again leads, a size up from Home; once it is up, its white ring ripples out (cream: gold was lost on the wood)
   and a gleam crosses it now and then, asking for the tap (EndCard.invite: GSAP moves .rip and .gleam i, transform +
   opacity only) */
#againBtn{position:relative;height:80px;padding:0 34px 0 26px;font-size:31px}
#againBtn svg{width:37px;height:37px}
#againBtn .rip{position:absolute;inset:-4px;border-radius:inherit;border:4px solid #fff6d2;opacity:0;pointer-events:none}
#againBtn .gleam{position:absolute;inset:0;border-radius:inherit;overflow:hidden;pointer-events:none}
#againBtn .gleam i{position:absolute;top:-12%;bottom:-12%;left:-45%;width:30%;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.5),rgba(255,255,255,0))}
/* short labels with no voice: a hint over FIRE, and a banner beside the cloud ("Watch how!"). Skip's look */
.note{position:absolute;left:0;top:0;translate:-50% 0;padding:10px 24px 9px;border-radius:99px;background:var(--glass);color:#fff;font-size:26px;line-height:1.15;white-space:nowrap;text-align:center;box-shadow:0 0 0 2.5px rgba(255,210,61,.9),0 8px 18px rgba(20,10,60,.28);opacity:0;transform:translateY(10px) scale(.94);transition:opacity .2s ease-in,transform .2s ease-in;pointer-events:none}
.note.on{opacity:1;transform:none;transition:opacity .28s ease-out,transform .45s cubic-bezier(.34,1.45,.64,1)}
#banner{left:330px;top:236px;translate:-50% 0;padding:12px 36px 11px;border-radius:26px} /* (in the sky left of the cloud) */
#banner b{display:block;font-weight:600;font-size:34px}
#banner span{display:block;font-size:22px;color:#ffe08a;margin-top:2px}

/* ---------- rotate hint ---------- */
#rotate{position:fixed;inset:0;display:none;place-items:center;text-align:center;background:rgba(20,12,60,.9);color:#fff;font-size:20px;line-height:1.45;padding:30px;z-index:20}
#rotate .ph{width:70px;height:110px;border:6px solid #fff;border-radius:16px;margin:0 auto 20px;animation:rot 2s ease-in-out infinite}
@keyframes rot{40%,70%{transform:rotate(90deg)}}
#rotate button{margin-top:22px;padding:11px 24px 10px;border-radius:99px;background:#fff;color:#3a2280;font-size:16px;letter-spacing:.01em}
@media (orientation:portrait) and (max-aspect-ratio:3/4){#rotate:not(.dismissed){display:grid}}
/* ---------- first paint: no loading screen. Until the start screen's pictures are in (usually well under a second)
   the screen is just the sky (#viewport's gradient); then the scene fades in and the start screen plays its intro ---------- */
html:not(.fit) #stage,html:not(.fit) #stageTop{visibility:hidden} /* (until fitStage has scaled it to the screen: no unscaled first frame) */
#world{opacity:0}                                      /* the painted scene fades in once its pictures are in (boot) */
#playBtn{opacity:0}                                    /* Title pops it in */
#flash{position:fixed;inset:0;background:radial-gradient(circle at 50% 25%,rgba(255,255,240,.85),rgba(255,255,255,0) 60%);opacity:0;transition:opacity .5s;pointer-events:none}
#flash.on{opacity:1;transition:opacity .08s}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;animation-delay:0s !important;transition-duration:.01ms !important;transition-delay:0s !important}
  #flash{display:none}
}
</style>
</head>
<body>
<div id="viewport">
  <div id="stage">
    <div id="world" class="title">
      <div id="bg"><img class="bl" id="bgSky" src="assets/img/bg_sky.webp" alt=""><div class="bl" id="bgSun"></div><img class="bl" id="bgMount" src="assets/img/bg_mount.webp" alt=""><div class="bl" id="bgBirds"></div><img class="bl" id="bgTrees" src="assets/img/bg_trees.webp" alt=""><div class="bl" id="bgJungle"></div><div class="bl plant" id="bgPlantL"><img src="assets/img/bg_plantL.webp" alt=""></div><div class="bl plant" id="bgPlantR"><img src="assets/img/bg_plantR.webp" alt=""></div><img class="bl" id="bgDeck" src="assets/img/bg_deck.webp" alt=""></div>
      <div id="cloud"><i class="chz"></i><img class="cl" src="assets/img/cloud.webp" alt=""><img class="clr" data-src="assets/img/cloud_rim.webp" alt=""><div id="qCard"><span id="qTab"></span></div><div id="eqBox"><div id="eq"></div></div></div>
      <div id="ground"></div>

        <div id="cannonBody"><img id="c1" data-src="assets/img/cannon1.webp" alt=""><img id="c2" data-src="assets/img/cannon2.webp" alt="" style="display:none"></div>
        <div id="sockFx"></div>
        <button id="fireBtn" class="off" data-i18n-attr="aria-label:btnFire"><i class="fgl"></i><img class="p1" data-src="assets/img/fire.webp" alt="" data-i18n-attr="alt:btnFire"><img class="p1 gr" data-src="assets/img/fire.webp" alt=""><img class="p2" data-src="assets/img/fire2.webp" alt="" data-i18n-attr="alt:btnFire"><img class="p2 gr" data-src="assets/img/fire2.webp" alt=""><span class="ft" data-i18n="btnFire"></span></button>

      <img id="rackFront" class="spr" data-src="assets/img/rack_front.webp" alt="">
    </div>
    <div id="thumb">
      <button id="playBtn" data-i18n-attr="aria-label:btnPlay"><span class="pg"></span><span class="rp"></span><img src="assets/img/playbtn.webp" alt="" data-i18n-attr="alt:btnPlay"></button></div>
    <div id="spot"><div class="sl"></div><div class="sl"></div></div>
    <div id="overlay">
      <div id="spotRing"></div>
      <div id="spotRing2"></div>
      <div id="spotGhost" class="ball" aria-hidden="true"></div>
      <img id="spotHand" data-src="assets/img/hand.webp" alt="" aria-hidden="true" draggable="false">
      <div id="banner" class="note" aria-live="polite"></div>
      <div id="tip" class="note" aria-live="polite"></div>
      <div id="endTitle" role="heading" aria-level="1" aria-live="polite"></div>
      <div id="endBtns">
        <button id="againBtn" class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg><span data-i18n="btnPlayAgain"></span><i class="rip" aria-hidden="true"></i><i class="gleam" aria-hidden="true"><i></i></i></button>
        <button id="homeBtn" class="pill alt"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 11 12 4l8.5 7"/><path d="M6 9.5V20h4.5v-5.5h3V20H18V9.5"/></svg><span data-i18n="btnHome"></span></button>
      </div>
    </div>
  </div>
  <div id="vig"></div>
  <canvas id="fx"></canvas>
  <!-- the caption sits above the FX canvas (cannon smoke never covers its words), in stage units but not moved by
       the camera; what flies (#worldTop) still passes over it -->
  <div id="stageTop"><div id="capPos"><div id="cap"><canvas class="bg"></canvas><span class="txt"></span></div></div><div id="worldTop"><div id="fly"></div></div></div>
  <div id="flash"></div>
  <div id="hud">
    <button id="pauseBtn" class="hbtn" data-i18n-attr="aria-label:btnPause"><img data-src="assets/img/pause.webp" alt=""></button>
    <button id="sndBtn" class="hbtn" data-i18n-attr="aria-label:btnSound"><img data-src="assets/img/sound.webp" alt=""></button>
    <button id="skipBtn" data-i18n-attr="aria-label:btnSkip"><span data-i18n="btnSkip"></span><svg viewBox="0 0 24 24" fill="#ffd23d" aria-hidden="true"><path d="M4 5.5v13l9-6.5zM13 5.5v13l9-6.5z"/></svg></button>
  </div>
  <div id="rotate"><div><div class="ph"></div><span data-i18n-html="rotateHint"></span><br><button id="rotateOk" data-i18n="btnPlayAnyway"></button></div></div></div>
<script>
/* Fit the art-space stage to the screen before the first paint, so the start screen shows at once, in its place
   (the same maths as Stage.resize; once the game's Stage is up, it does the job and boot() removes this). */
function fitStage() {
  if (typeof Stage !== 'undefined' && Stage.el) { Stage.resize(); return; }
  var DW = 1672, DH = 941, W = innerWidth, H = innerHeight, S = Math.min(W / DW, H / DH);
  document.getElementById('stage').style.transform = document.getElementById('stageTop').style.transform =
    'translate(' + (W - DW * S) / 2 + 'px,' + (H - DH * S) / 2 + 'px) scale(' + S + ')';
  document.documentElement.classList.add('fit');
}
fitStage(); addEventListener('resize', fitStage);
</script>
<!-- Load order (there is no loading screen): GSAP (bundled in libs/, never a CDN), the words (js/i18n.js reads
     locales/locales.json, or locales/locales.js when opened from disk), then the game (js/script.js, built from src/
     by ./build.sh; it has been downloading since the <head>). The game shows the start screen as soon as its pictures
     are in, then fetches the rest while the player looks at it: the play scene's pictures and the sound effects
     (js/sfx.js). The start screen's own few sounds (js/sfx_title.js, ~35 KB) come with the page, ready for its entrance. -->
<script src="libs/gsap.min.js"></script>
<script src="js/i18n.js"></script>
<script src="js/sfx_title.js"></script>
<script>
I18n.load(function () {
  I18n.applyStatic();
  var s = document.createElement('script');
  s.src = 'js/script.js';
  document.body.appendChild(s);
});
</script>
</body>
